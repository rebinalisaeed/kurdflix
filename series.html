<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdFlix - وردەکاری زنجیرە</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .series-detail-container {
            max-width: 1200px;
            margin: 100px auto 2rem auto;
            padding: 0 1rem;
        }
        .series-hero {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .series-hero-poster {
            flex: 0 0 300px;
        }
        .series-hero-poster img {
            width: 100%;
            border-radius: 12px;
        }
        .series-hero-info {
            flex: 1;
        }
        .series-hero-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .series-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .series-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .series-genre-tag {
            background-color: var(--bg-secondary);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .series-description {
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }
        .episodes-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }
        .episodes-section h3 {
            margin-bottom: 1rem;
        }
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .episode-item {
            background-color: var(--bg-secondary);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }
        .episode-item:hover {
            background-color: var(--border);
        }
        .episode-title {
            font-weight: bold;
        }
        .episode-number {
            color: var(--accent);
        }
        .watch-episode-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .trailer-container {
            margin: 2rem 0;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .trailer-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .watch-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .back-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            display: inline-block;
        }
        @media (max-width: 768px) {
            .series-detail-container {
                margin-top: 80px;
            }
            .series-hero-poster {
                flex: 0 0 200px;
            }
            .series-hero-info h1 {
                font-size: 1.5rem;
            }
            .episode-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></div>
            <div class="logo" id="logoBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" class="logo-svg">
                    <defs><path id="arcPath" d="M 10,168 Q 450,100 890,168" /></defs>
                    <text font-family="'Arial Black'" font-size="148" font-weight="900" font-style="italic" fill="#E50914" letter-spacing="-3">
                        <textPath href="#arcPath" startOffset="50%" text-anchor="middle">KURDFLIX</textPath>
                    </text>
                </svg>
            </div>
            <div class="mobile-search-icon" id="mobileSearchIcon"><i class="fas fa-search"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="all-movies.html?type=films">فیلمەکان</a></li>
                <li><a href="all-movies.html?type=series">زنجیرەکان</a></li>
                <li><a href="#">زنجیرەفیلم</a></li>
                <li><a href="#">ژێرنووسی کوردی</a></li>
                <li><a href="all-movies.html?top250">Top 250</a></li>
                <li><a href="staff.html">ستافی کوردفلێکس</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-icon" id="searchIcon"><i class="fas fa-search"></i></div>
                <div class="login-icon" id="loginIcon"><i class="fas fa-user"></i></div>
                <button class="vip-btn" id="vipBtn">VIP</button>
            </div>
        </div>
        <div class="search-form" id="searchForm" style="display: none;">
            <input type="text" id="searchInput" placeholder="گەڕان بە ناوی فیلم یان زنجیرە...">
            <button id="searchClose"><i class="fas fa-times"></i></button>
            <div id="searchResults" class="search-results"></div>
        </div>
    </nav>

    <div class="series-detail-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← گەڕانەوە بۆ پەڕەی سەرەکی</button>
        <div id="seriesDetail"></div>
    </div>

    <script>
        let allSeriesData = [];
        
        async function loadSeriesDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const seriesId = parseInt(urlParams.get('id'));
            if (!seriesId) {
                document.getElementById('seriesDetail').innerHTML = '<p>زنجیرە نەدۆزرایەوە</p>';
                return;
            }
            
            try {
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                allSeriesData = data.movies || [];
                const series = allSeriesData.find(m => m.id === seriesId && m.type === 'series');
                
                if (!series) {
                    document.getElementById('seriesDetail').innerHTML = '<p>زنجیرە نەدۆزرایەوە</p>';
                    return;
                }
                
                let embedUrl = series.videoUrl;
                if (series.videoUrl && series.videoUrl.includes("vidmoly")) {
                    embedUrl = series.videoUrl.replace("/e/", "/embed/");
                } else if (series.videoUrl && series.videoUrl.includes("streamsb")) {
                    embedUrl = series.videoUrl.replace("/e/", "/embed-4/");
                }
                
                const genresHtml = series.genres && series.genres.length > 0 
                    ? `<div class="series-genres">${series.genres.map(g => `<span class="series-genre-tag">${g}</span>`).join('')}</div>` : '';
                
                const episodesHtml = series.episodes && series.episodes.length > 0 
                    ? `
                        <div class="episodes-section">
                            <h3><i class="fas fa-list"></i> ئەڵقەکان</h3>
                            <div class="episode-list">
                                ${series.episodes.map(ep => `
                                    <div class="episode-item" onclick="window.location.href='player.html?id=${series.id}&episode=${ep.number}&type=series'">
                                        <div>
                                            <span class="episode-number">ئەڵقەی ${ep.number}</span>
                                            <span class="episode-title"> - ${ep.title}</span>
                                        </div>
                                        <button class="watch-episode-btn">📺 سەیرکردن</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : '';
                
                document.getElementById('seriesDetail').innerHTML = `
                    <div class="series-hero">
                        <div class="series-hero-poster">
                            <img src="${series.poster}" alt="${series.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                        </div>
                        <div class="series-hero-info">
                            <h1>${series.title}</h1>
                            <div class="series-meta">
                                <span>${series.year}</span>
                                <span>زنجیرە</span>
                                <span>${series.lang === 'kurdish' ? 'کوردی' : series.lang === 'turkish' ? 'تورکی' : series.lang === 'persian' ? 'فارسی' : series.lang === 'arabic' ? 'عەرەبی' : 'ئینگلیزی'}</span>
                            </div>
                            ${genresHtml}
                            <p class="series-description">${series.description || 'زانیاری زیادە بەم زووانە دەخرێتە ناو سایت'}</p>
                            <button class="watch-btn" onclick="window.location.href='player.html?id=${series.id}&type=series'">📺 بینینی ئێستا</button>
                        </div>
                    </div>
                    ${series.trailerUrl ? `<div class="trailer-container"><iframe src="${series.trailerUrl}" frameborder="0" allowfullscreen></iframe></div>` : ''}
                    ${episodesHtml}
                `;
            } catch (error) {
                document.getElementById('seriesDetail').innerHTML = '<p>هەڵە لە بارکردنی داتاکان</p>';
            }
        }
        
        function initNavbarScroll() {
            const navbar = document.querySelector('.navbar');
            if (!navbar) return;
            function checkScroll() {
                if (window.scrollY >= 150) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            }
            checkScroll();
            window.addEventListener('scroll', checkScroll);
        }
        
        function initHamburger() {
            const hamburger = document.getElementById('hamburgerBtn');
            const navMenu = document.getElementById('navMenu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => navMenu.classList.toggle('active'));
            }
        }
        
        function initLogoClick() {
            const logo = document.getElementById('logoBtn');
            if (logo) {
                logo.addEventListener('click', () => { window.location.href = 'index.html'; });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadSeriesDetail();
            initNavbarScroll();
            initHamburger();
            initLogoClick();
        });
    </script>
</body>
</html>
