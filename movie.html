<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdFlix - وردەکاری فیلم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .movie-detail-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .movie-hero {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .movie-hero-poster {
            flex: 0 0 300px;
        }
        .movie-hero-poster img {
            width: 100%;
            border-radius: 12px;
        }
        .movie-hero-info {
            flex: 1;
        }
        .movie-hero-info h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .movie-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .movie-description {
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }
        .trailer-container {
            margin: 2rem 0;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .trailer-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .watch-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .back-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            display: inline-block;
        }
    </style>
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>KURD<span>FLIX</span></h1>
            </div>
        </div>
    </nav>

    <div class="movie-detail-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← گەڕانەوە بۆ پەڕەی سەرەکی</button>
        <div id="movieDetail">
            <!-- وردەکاری فیلمەکە لێرەدا دادەنرێت -->
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadMovieDetail() {
            const movieId = parseInt(getQueryParam('id'));
            if (!movieId) {
                document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                return;
            }
            
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const movie = data.movies.find(m => m.id === movieId);
                
                if (!movie) {
                    document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                    return;
                }
                
                let embedUrl = movie.videoUrl;
                if (movie.videoUrl.includes("vidmoly")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed/");
                } else if (movie.videoUrl.includes("streamsb")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed-4/");
                }
                
                document.getElementById('movieDetail').innerHTML = `
                    <div class="movie-hero">
                        <div class="movie-hero-poster">
                            <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                        </div>
                        <div class="movie-hero-info">
                            <h1>${movie.title}</h1>
                            <div class="movie-meta">
                                <span>${movie.year}</span>
                                <span>${movie.type === 'film' ? 'فیلم' : 'زنجیرە'}</span>
                            </div>
                            <p class="movie-description">${movie.description || 'زانیاری زیادە بەم زووانە دەخرێتە ناو سایت'}</p>
                            <button class="watch-btn" onclick="watchNow('${embedUrl}', '${movie.title}')">📺 بینینی ئێستا</button>
                        </div>
                    </div>
                    ${movie.trailerUrl ? `
                        <div class="trailer-container">
                            <iframe src="${movie.trailerUrl}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    ` : ''}
                `;
            } catch (error) {
                document.getElementById('movieDetail').innerHTML = '<p>هەڵە لە بارکردنی داتاکان</p>';
            }
        }
        
        function watchNow(embedUrl, title) {
            const playerHTML = `
                <div id="playerModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">
                    <div style="background:var(--bg-secondary); width:90%; max-width:1000px; border-radius:12px; overflow:hidden;">
                        <div style="display:flex; justify-content:space-between; padding:1rem; border-bottom:1px solid var(--border);">
                            <h3>${title}</h3>
                            <button id="closePlayer" style="background:none; border:none; color:var(--text-primary); font-size:1.8rem; cursor:pointer;">&times;</button>
                        </div>
                        <div style="position:relative; padding-bottom:56.25%; height:0;">
                            <iframe src="${embedUrl}" frameborder="0" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%;"></iframe>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML("beforeend", playerHTML);
            document.getElementById("closePlayer").onclick = () => {
                document.getElementById("playerModal").remove();
            };
        }
        
        loadMovieDetail();
    </script>
</body>
</html>
