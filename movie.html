<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KurdFlix - وردەکاری فیلم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ========== دیزاینی تایبەتی پەڕەی وردەکاری ========== */
        .detail-container {
            max-width: 1200px;
            margin: 100px auto 2rem auto;
            padding: 0 1rem;
        }
        .detail-hero {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        .detail-poster {
            flex: 0 0 300px;
            position: relative;
        }
        .detail-poster img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .detail-info {
            flex: 1;
        }
        .detail-info h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .detail-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .detail-genre-tag {
            background-color: var(--bg-secondary);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .detail-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .watch-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .watch-btn:hover {
            background-color: #b20710;
            transform: scale(1.02);
        }
        .favorite-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.8rem 2rem;
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .favorite-btn:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .detail-description {
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        .detail-section {
            margin-bottom: 2rem;
        }
        .detail-section h3 {
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }
        .cast-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .cast-item {
            background-color: var(--bg-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
        }
        .cast-item:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
        }
        .crew-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .crew-item {
            background-color: var(--bg-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .related-section {
            margin-top: 3rem;
        }
        .related-section h3 {
            margin-bottom: 1rem;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }
        .related-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            border: 1px solid var(--border);
        }
        .related-card:hover {
            transform: scale(1.05);
        }
        .related-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .related-info {
            padding: 0.5rem;
            text-align: center;
        }
        .related-title {
            font-size: 0.85rem;
            font-weight: bold;
        }
        .back-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .detail-container {
                margin-top: 80px;
            }
            .detail-poster {
                flex: 0 0 200px;
            }
            .detail-info h1 {
                font-size: 1.5rem;
            }
            .detail-buttons {
                flex-direction: column;
            }
            .related-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 1rem;
            }
            .related-poster {
                height: 180px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- ناوبار -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></div>
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" class="logo-svg">
                    <defs><path id="arcPath" d="M 10,168 Q 450,100 890,168" /></defs>
                    <text font-family="'Arial Black'" font-size="148" font-weight="900" font-style="italic" fill="#E50914" letter-spacing="-3">
                        <textPath href="#arcPath" startOffset="50%" text-anchor="middle">KURDFLIX</textPath>
                    </text>
                </svg>
            </div>
            <div class="mobile-search-icon" id="mobileSearchIcon"><i class="fas fa-search"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">گەڕانەوە بۆ پەڕەی سەرەکی</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-icon" id="searchIcon"><i class="fas fa-search"></i></div>
                <div class="login-icon" id="loginIcon"><i class="fas fa-user"></i></div>
                <button class="vip-btn" id="vipBtn">VIP</button>
                <div class="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <label class="switch"><input type="checkbox" id="theme-switch"><span class="slider round"></span></label>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </div>
        <div class="search-form" id="searchForm" style="display: none;">
            <input type="text" id="searchInput" placeholder="گەڕان بە ناوی فیلم یان زنجیرە...">
            <button id="searchClose"><i class="fas fa-times"></i></button>
            <div id="searchResults" class="search-results"></div>
        </div>
    </nav>

    <div class="detail-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← گەڕانەوە بۆ پەڕەی سەرەکی</button>
        <div id="movieDetail"></div>
    </div>

    <!-- فووتەر -->
    <footer>
        <div class="footer-social">
            <div class="footer-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" width="180">
                    <defs><path id="arcPathFooter" d="M 10,168 Q 450,100 890,168" /></defs>
                    <text font-family="'Arial Black'" font-size="148" font-weight="900" font-style="italic" fill="#E50914" letter-spacing="-3">
                        <textPath href="#arcPathFooter" startOffset="50%" text-anchor="middle">KURDFLIX</textPath>
                    </text>
                </svg>
            </div>
            <p class="social-text">دەتوانن لەم شوێنانە لەگەڵمان بن</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/kurdflix" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/kurdflix" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://t.me/kurdflix" target="_blank"><i class="fab fa-telegram-plane"></i></a>
                <a href="https://www.tiktok.com/@kurdflix" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.snapchat.com/add/kurdflix" target="_blank"><i class="fab fa-snapchat-ghost"></i></a>
                <a href="https://www.threads.net/@kurdflix" target="_blank"><i class="fab fa-threads"></i></a>
                <a href="https://twitter.com/kurdflix" target="_blank"><i class="fab fa-x-twitter"></i></a>
                <a href="https://youtube.com/@kurdflix" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
        <div class="footer-about">
            <h3>دەربارە</h3>
            <p id="aboutText">کوردفلێکس پێگەیەکی نوێیە تازەگەری دەکات لە گەیاندنی بەرهەمە سینەماییە خۆماڵیەکان و جیهانیەکان</p>
        </div>
        <div class="footer-copyright">
            <p id="copyrightText">kurdflix.com 2026 ©</p>
        </div>
    </footer>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>چوونە ژوورەوە</h2>
            <form id="loginForm">
                <input type="email" placeholder="ئیمەیڵ" required>
                <input type="password" placeholder="پاسیۆرد" required>
                <button type="submit">چوونە ژوورەوە</button>
            </form>
            <p>هەژمارت نییە؟ <a href="#">تۆمار بکە</a></p>
        </div>
    </div>

    <div id="vipModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>VIP - پلانی تایبەت</h2>
            <p>بە زوو ئەم بەشە کارا دەبێت...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentMovie = null;
        let allData = [];

        async function loadMovieDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = parseInt(urlParams.get('id'));
            if (!movieId) {
                document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                return;
            }
            
            try {
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                allData = data.movies || [];
                currentMovie = allData.find(m => m.id === movieId && m.type === 'film');
                
                if (!currentMovie) {
                    document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                    return;
                }
                
                // بەرهەمە نزیکەکان (هەمان چەشن)
                const relatedMovies = allData.filter(m => 
                    m.id !== movieId && 
                    m.type === 'film' && 
                    m.genres && currentMovie.genres && 
                    m.genres.some(g => currentMovie.genres.includes(g))
                ).slice(0, 6);
                
                const genresHtml = currentMovie.genres && currentMovie.genres.length > 0 
                    ? `<div class="detail-genres">${currentMovie.genres.map(g => `<span class="detail-genre-tag">${g}</span>`).join('')}</div>` : '';
                
                const castHtml = currentMovie.cast && currentMovie.cast.length > 0 
                    ? `<div class="detail-section"><h3><i class="fas fa-users"></i> ئەکتەرەکان</h3><div class="cast-list">${currentMovie.cast.map(actor => `<div class="cast-item" onclick="location.href='actor.html?id=${actor.id}'">${actor.name}</div>`).join('')}</div></div>` : '';
                
                const crewHtml = currentMovie.crew && currentMovie.crew.length > 0 
                    ? `<div class="detail-section"><h3><i class="fas fa-video"></i> دەرهێنەر و ستاف</h3><div class="crew-list">${currentMovie.crew.map(person => `<div class="crew-item">${person.role}: ${person.name}</div>`).join('')}</div></div>` : '';
                
                const relatedHtml = relatedMovies.length > 0 
                    ? `<div class="related-section"><h3><i class="fas fa-film"></i> بەرهەمە نزیکەکان</h3><div class="related-grid">${relatedMovies.map(movie => `
                        <div class="related-card" onclick="location.href='movie.html?id=${movie.id}'">
                            <img src="${movie.poster}" class="related-poster" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
                            <div class="related-info">
                                <div class="related-title">${movie.title}</div>
                            </div>
                        </div>
                    `).join('')}</div></div>` : '';
                
                document.getElementById('movieDetail').innerHTML = `
                    <div class="detail-hero">
                        <div class="detail-poster">
                            <img src="${currentMovie.poster}" alt="${currentMovie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                        </div>
                        <div class="detail-info">
                            <h1>${currentMovie.title}</h1>
                            <div class="detail-meta">
                                <span><i class="fas fa-calendar-alt"></i> ${currentMovie.year}</span>
                                <span><i class="fas fa-clock"></i> ${currentMovie.duration || '---'}</span>
                            </div>
                            ${genresHtml}
                            <div class="detail-buttons">
                                <button class="watch-btn" onclick="window.location.href='player.html?id=${currentMovie.id}&type=film'">🎬 بینین</button>
                                <button class="favorite-btn" onclick="addToFavorites(${currentMovie.id})">❤️ بیخە لیستی دڵخواز</button>
                            </div>
                            <div class="detail-description">
                                <p>${currentMovie.description || 'زانیاری زیادە بەم زووانە دەخرێتە ناو سایت'}</p>
                            </div>
                        </div>
                    </div>
                    ${castHtml}
                    ${crewHtml}
                    ${relatedHtml}
                `;
            } catch (error) {
                document.getElementById('movieDetail').innerHTML = '<p>هەڵە لە بارکردنی داتاکان</p>';
            }
        }
        
        function addToFavorites(movieId) {
            let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (!favorites.includes(movieId)) {
                favorites.push(movieId);
                localStorage.setItem('favorites', JSON.stringify(favorites));
                alert('فیلم بە سەرکەوتوویی زیاد کرا بۆ لیستی دڵخوازەکان!');
            } else {
                alert('ئەم فیلمە پێشتر لە لیستی دڵخوازەکاندا هەیە');
            }
        }
        
        loadMovieDetail();
    </script>
</body>
</html>
