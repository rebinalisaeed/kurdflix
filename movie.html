<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdFlix - وردەکاری فیلم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .movie-detail-container {
            max-width: 1200px;
            margin: 100px auto 2rem auto;
            padding: 0 1rem;
        }
        .movie-hero {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .movie-hero-poster {
            flex: 0 0 300px;
        }
        .movie-hero-poster img {
            width: 100%;
            border-radius: 12px;
        }
        .movie-hero-info {
            flex: 1;
        }
        .movie-hero-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .movie-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .movie-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .movie-genre-tag {
            background-color: var(--bg-secondary);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .movie-description {
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }
        .trailer-container {
            margin: 2rem 0;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .trailer-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .watch-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .back-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            display: inline-block;
        }
        @media (max-width: 768px) {
            .movie-detail-container {
                margin-top: 80px;
            }
            .movie-hero-poster {
                flex: 0 0 200px;
            }
            .movie-hero-info h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></div>
            <div class="logo" id="logoBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" class="logo-svg">
                    <defs><path id="arcPath" d="M 10,168 Q 450,100 890,168" /></defs>
                    <text font-family="'Arial Black'" font-size="148" font-weight="900" font-style="italic" fill="#E50914" letter-spacing="-3">
                        <textPath href="#arcPath" startOffset="50%" text-anchor="middle">KURDFLIX</textPath>
                    </text>
                </svg>
            </div>
            <div class="mobile-search-icon" id="mobileSearchIcon"><i class="fas fa-search"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="all-movies.html?type=films">فیلمەکان</a></li>
                <li><a href="all-movies.html?type=series">زنجیرەکان</a></li>
                <li><a href="#">زنجیرەفیلم</a></li>
                <li><a href="#">ژێرنووسی کوردی</a></li>
                <li><a href="all-movies.html?top250">Top 250</a></li>
                <li><a href="staff.html">ستافی کوردفلێکس</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-icon" id="searchIcon"><i class="fas fa-search"></i></div>
                <div class="login-icon" id="loginIcon"><i class="fas fa-user"></i></div>
                <button class="vip-btn" id="vipBtn">VIP</button>
            </div>
        </div>
        <div class="search-form" id="searchForm" style="display: none;">
            <input type="text" id="searchInput" placeholder="گەڕان بە ناوی فیلم یان زنجیرە...">
            <button id="searchClose"><i class="fas fa-times"></i></button>
            <div id="searchResults" class="search-results"></div>
        </div>
    </nav>

    <div class="movie-detail-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← گەڕانەوە بۆ پەڕەی سەرەکی</button>
        <div id="movieDetail"></div>
    </div>

    <script>
        let allMoviesData = [];
        
        async function loadMovieDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = parseInt(urlParams.get('id'));
            if (!movieId) {
                document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                return;
            }
            
            try {
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                allMoviesData = data.movies || [];
                const movie = allMoviesData.find(m => m.id === movieId && m.type === 'film');
                
                if (!movie) {
                    document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                    return;
                }
                
                let embedUrl = movie.videoUrl;
                if (movie.videoUrl && movie.videoUrl.includes("vidmoly")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed/");
                } else if (movie.videoUrl && movie.videoUrl.includes("streamsb")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed-4/");
                }
                
                const genresHtml = movie.genres && movie.genres.length > 0 
                    ? `<div class="movie-genres">${movie.genres.map(g => `<span class="movie-genre-tag">${g}</span>`).join('')}</div>` : '';
                
                document.getElementById('movieDetail').innerHTML = `
                    <div class="movie-hero">
                        <div class="movie-hero-poster">
                            <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                        </div>
                        <div class="movie-hero-info">
                            <h1>${movie.title}</h1>
                            <div class="movie-meta">
                                <span>${movie.year}</span>
                                <span>فیلم</span>
                                <span>${movie.lang === 'kurdish' ? 'کوردی' : movie.lang === 'turkish' ? 'تورکی' : movie.lang === 'persian' ? 'فارسی' : movie.lang === 'arabic' ? 'عەرەبی' : 'ئینگلیزی'}</span>
                            </div>
                            ${genresHtml}
                            <p class="movie-description">${movie.description || 'زانیاری زیادە بەم زووانە دەخرێتە ناو سایت'}</p>
                            <button class="watch-btn" onclick="window.location.href='player.html?id=${movie.id}&type=film'">📺 بینینی ئێستا</button>
                        </div>
                    </div>
                    ${movie.trailerUrl ? `<div class="trailer-container"><iframe src="${movie.trailerUrl}" frameborder="0" allowfullscreen></iframe></div>` : ''}
                `;
            } catch (error) {
                document.getElementById('movieDetail').innerHTML = '<p>هەڵە لە بارکردنی داتاکان</p>';
            }
        }
        
        function initNavbarScroll() {
            const navbar = document.querySelector('.navbar');
            if (!navbar) return;
            function checkScroll() {
                if (window.scrollY >= 150) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            }
            checkScroll();
            window.addEventListener('scroll', checkScroll);
        }
        
        function initHamburger() {
            const hamburger = document.getElementById('hamburgerBtn');
            const navMenu = document.getElementById('navMenu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => navMenu.classList.toggle('active'));
            }
        }
        
        function initLogoClick() {
            const logo = document.getElementById('logoBtn');
            if (logo) {
                logo.addEventListener('click', () => { window.location.href = 'index.html'; });
            }
        }
        
        function initSearch() {
            const searchIcon = document.getElementById('searchIcon');
            const mobileSearchIcon = document.getElementById('mobileSearchIcon');
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchClose = document.getElementById('searchClose');
            const openSearch = () => {
                searchForm.style.display = searchForm.style.display === 'none' ? 'block' : 'none';
                if (searchForm.style.display === 'block' && searchInput) searchInput.focus();
            };
            if (searchIcon) searchIcon.addEventListener('click', openSearch);
            if (mobileSearchIcon) mobileSearchIcon.addEventListener('click', openSearch);
            if (searchClose) searchClose.addEventListener('click', () => { searchForm.style.display = 'none'; });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadMovieDetail();
            initNavbarScroll();
            initHamburger();
            initLogoClick();
            initSearch();
        });
    </script>
</body>
</html>
