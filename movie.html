<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdFlix - وردەکاری فیلم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .movie-detail-container {
            max-width: 1200px;
            margin: 100px auto 2rem auto;
            padding: 0 1rem;
        }
        .movie-hero {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .movie-hero-poster {
            flex: 0 0 300px;
        }
        .movie-hero-poster img {
            width: 100%;
            border-radius: 12px;
        }
        .movie-hero-info {
            flex: 1;
        }
        .movie-hero-info h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-family: 'NRT', sans-serif;
            font-weight: bold;
        }
        .movie-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
            font-family: 'NRT', sans-serif;
        }
        .movie-description {
            margin-bottom: 1.5rem;
            line-height: 1.8;
            font-family: 'NRT', sans-serif;
        }
        .trailer-container {
            margin: 2rem 0;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .trailer-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .watch-btn {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: 'NRT', sans-serif;
            font-weight: bold;
        }
        .back-btn {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            display: inline-block;
            font-family: 'NRT', sans-serif;
        }
        @media (max-width: 768px) {
            .movie-detail-container {
                margin-top: 80px;
            }
            .movie-hero-poster {
                flex: 0 0 200px;
            }
            .movie-hero-info h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            
            <div class="nav-right">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" class="logo-svg">
                        <defs>
                            <path id="arcPath" d="M 10,168 Q 450,100 890,168" />
                        </defs>
                        <text
                            font-family="'Arial Black', 'Arial Bold', sans-serif"
                            font-size="148"
                            font-weight="900"
                            font-style="italic"
                            fill="#E50914"
                            letter-spacing="-3"
                        >
                            <textPath href="#arcPath" startOffset="50%" text-anchor="middle">KURDFLIX</textPath>
                        </text>
                    </svg>
                </div>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="index.html">گەڕانەوە بۆ پەڕەی سەرەکی</a></li>
                </ul>
            </div>
            
            <div class="nav-center"></div>
            
            <div class="nav-actions">
                <a href="index.html" style="color: var(--text-primary);"><i class="fas fa-home"></i></a>
                <div class="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <label class="switch">
                        <input type="checkbox" id="theme-switch">
                        <span class="slider round"></span>
                    </label>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="movie-detail-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← گەڕانەوە بۆ پەڕەی سەرەکی</button>
        <div id="movieDetail">
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        function initTheme() {
            const themeSwitch = document.getElementById('theme-switch');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                if (themeSwitch) themeSwitch.checked = true;
            } else {
                document.body.setAttribute('data-theme', 'dark');
                if (themeSwitch) themeSwitch.checked = false;
            }
            if (themeSwitch) {
                themeSwitch.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        document.body.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    } else {
                        document.body.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                    }
                });
            }
        }
        
        async function loadMovieDetail() {
            const movieId = parseInt(getQueryParam('id'));
            if (!movieId) {
                document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                return;
            }
            
            try {
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                const movie = data.movies.find(m => m.id === movieId);
                
                if (!movie) {
                    document.getElementById('movieDetail').innerHTML = '<p>فیلم نەدۆزرایەوە</p>';
                    return;
                }
                
                let embedUrl = movie.videoUrl;
                if (movie.videoUrl && movie.videoUrl.includes("vidmoly")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed/");
                } else if (movie.videoUrl && movie.videoUrl.includes("streamsb")) {
                    embedUrl = movie.videoUrl.replace("/e/", "/embed-4/");
                }
                
                document.getElementById('movieDetail').innerHTML = `
                    <div class="movie-hero">
                        <div class="movie-hero-poster">
                            <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                        </div>
                        <div class="movie-hero-info">
                            <h1>${movie.title}</h1>
                            <div class="movie-meta">
                                <span>${movie.year}</span>
                                <span>${movie.type === 'film' ? 'فیلم' : 'زنجیرە'}</span>
                            </div>
                            <p class="movie-description">${movie.description || 'زانیاری زیادە بەم زووانە دەخرێتە ناو سایت'}</p>
                            <button class="watch-btn" onclick="watchNow('${embedUrl}', '${movie.title}')">📺 بینینی ئێستا</button>
                        </div>
                    </div>
                    ${movie.trailerUrl ? `
                        <div class="trailer-container">
                            <iframe src="${movie.trailerUrl}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    ` : ''}
                `;
            } catch (error) {
                document.getElementById('movieDetail').innerHTML = '<p>هەڵە لە بارکردنی داتاکان</p>';
            }
        }
        
        function watchNow(embedUrl, title) {
            const playerHTML = `
                <div id="playerModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">
                    <div style="background:var(--bg-secondary); width:90%; max-width:1000px; border-radius:12px; overflow:hidden;">
                        <div style="display:flex; justify-content:space-between; padding:1rem; border-bottom:1px solid var(--border);">
                            <h3 style="font-family:'NRT',sans-serif;">${title}</h3>
                            <button id="closePlayer" style="background:none; border:none; color:var(--text-primary); font-size:1.8rem; cursor:pointer;">&times;</button>
                        </div>
                        <div style="position:relative; padding-bottom:56.25%; height:0;">
                            <iframe src="${embedUrl}" frameborder="0" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%;"></iframe>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML("beforeend", playerHTML);
            document.getElementById("closePlayer").onclick = () => {
                document.getElementById("playerModal").remove();
            };
        }
        
        initTheme();
        loadMovieDetail();
        
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
        
        function initNavbarScroll() {
            const navbar = document.querySelector('.navbar');
            if (!navbar) return;
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }
        initNavbarScroll();
    </script>
</body>
</html>
