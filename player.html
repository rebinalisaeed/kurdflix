<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kurdish Video Player - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Custom Font - NRT-Bd.ttf */
  @font-face {
    font-family: 'NRT';
    src: url('fonts/NRT-Bd.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }
  
  @font-face {
    font-family: 'NRT';
    src: url('fonts/NRT-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --bg-page: #0f0f0f;
    --bg-player: #000;
    --bg-controls: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    --bg-progress-track: rgba(255,255,255,0.25);
    --bg-progress-buffer: rgba(255,255,255,0.4);
    --accent: #ff0000;
    --accent-hover: #cc0000;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --control-hover: rgba(255,255,255,0.12);
    --tooltip-bg: rgba(28,28,28,0.95);
    --font: 'NRT', 'Inter', 'Segoe UI', sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    overflow: hidden;
    touch-action: pan-x pan-y;
  }

  .player-wrapper {
    width: 100%;
    height: 100vh;
    max-width: none;
    background: #000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .video-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .video-container.show-cursor { cursor: default; }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    /* Prevent zoom on video itself */
    transform: scale(1);
  }

  /* Poster */
  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .poster-overlay.hidden { opacity: 0; pointer-events: none; }

  .poster-play-btn {
    width: clamp(56px, 8vw, 72px);
    height: clamp(56px, 8vw, 72px);
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 8px 32px rgba(255,0,0,0.35);
  }
  .poster-play-btn:hover { transform: scale(1.1); background: var(--accent-hover); }
  .poster-play-btn svg { width: 28px; height: 28px; fill: #fff; margin-right: -3px; }

  /* Loading */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Center Ripple & Icon */
  .click-ripple {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
  }
  .click-ripple.animate { animation: ripple 0.4s ease-out forwards; }
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    backdrop-filter: blur(4px);
  }
  .center-icon.animate { animation: pop 0.3s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .center-icon svg { width: 44px; height: 44px; fill: #fff; margin-left: 4px; }

  /* Controls Overlay */
  .controls-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-controls);
    padding: 48px 16px 16px;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .controls-overlay.hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  /* Progress Bar */
  .progress-area {
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 5px;
    background: var(--bg-progress-track);
    border-radius: 3px;
    overflow: hidden;
    transition: height 0.15s;
  }
  .progress-area:hover .progress-track { height: 7px; }

  .progress-buffer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--bg-progress-buffer);
    border-radius: 3px;
    width: 0%;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    z-index: 1;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }
  .progress-area:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

  .progress-tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    transform: translateX(50%);
    background: var(--tooltip-bg);
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
    font-family: monospace;
  }
  .progress-area:hover .progress-tooltip { opacity: 1; }

  /* Control Row */
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    justify-content: flex-end;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.05s;
    flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn:hover { background: var(--control-hover); }
  .ctrl-btn:active { transform: scale(0.95); }
  
  /* Desktop icons 2x larger */
  @media (min-width: 769px) {
    .ctrl-btn svg { width: 44px !important; height: 44px !important; }
    .ctrl-btn { padding: 12px; }
    .time-display { font-size: 18px; }
  }
  
  .ctrl-btn svg { width: 32px; height: 32px; fill: currentColor; }

  /* Volume Group */
  .volume-group {
    display: flex;
    align-items: center;
    gap: 0;
    margin-right: auto;
  }

  .volume-slider-wrap {
    max-width: 0;
    overflow: hidden;
    transition: max-width 0.25s ease, opacity 0.25s;
    opacity: 0;
    display: flex;
    align-items: center;
  }
  .volume-slider-wrap.visible {
    max-width: 120px;
    opacity: 1;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    margin: 0 10px;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  .time-display {
    font-size: 15px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    font-family: monospace;
    letter-spacing: 0.5px;
    order: 4;
  }

  /* Right side items order: Fullscreen, Quality, CC, Time */
  .right-group {
    display: flex;
    align-items: center;
    gap: 8px;
    order: 2;
  }

  /* Popup Menus */
  .popup-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(22,22,22,0.98);
    border-radius: 12px;
    min-width: 180px;
    padding: 8px 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
  }
  .popup-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }

  .popup-section-label {
    font-size: 10px;
    color: var(--text-muted);
    padding: 6px 14px 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-family: var(--font);
  }
  .popup-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 6px 0;
  }
  
  /* Two-column menu */
  .two-column-menu {
    min-width: 280px;
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 8px;
  }
  .menu-column {
    flex: 1;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .menu-column:last-child { border-right: none; }
  
  .popup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    font-family: var(--font);
  }
  .popup-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .popup-item.active { color: var(--accent); }
  .popup-item .check { width: 14px; height: 14px; fill: var(--accent); opacity: 0; flex-shrink: 0; }
  .popup-item.active .check { opacity: 1; }

  /* Desktop only elements */
  .desktop-only {
    display: flex !important;
  }
  
  .mobile-only {
    display: none !important;
  }

  /* Desktop play/pause/seek buttons */
  .desktop-play-seek {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }

  /* Mobile Center Controls */
  .mobile-center-controls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 18;
    align-items: center;
    justify-content: center;
  }
  .mobile-center-controls.visible { display: flex; }

  .mobile-play-btn {
    background: rgba(0,0,0,0.55);
    border: none;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: all;
    color: #fff;
    transition: background 0.15s, transform 0.1s;
    backdrop-filter: blur(8px);
  }
  .mobile-play-btn:active { transform: scale(0.92); }
  .mobile-play-btn svg { width: 50px; height: 50px; fill: currentColor; margin-left: 5px; }

  /* Mobile seek buttons */
  .mobile-seek-overlay {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 17;
  }
  .mobile-seek-left { left: 0; }
  .mobile-seek-right { right: 0; }
  
  .mobile-seek-btn {
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 60px;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: background 0.15s, transform 0.1s;
    cursor: pointer;
  }
  .mobile-seek-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.6); }
  .mobile-seek-btn svg { width: 48px; height: 48px; fill: #ffffff; }

  /* ====== MOBILE STYLES ====== */
  @media (max-width: 768px) {
    .desktop-only, .desktop-play-seek { display: none !important; }
    .mobile-only { display: flex !important; }
    
    body { overflow: hidden; }
    .player-wrapper { height: 100vh; border-radius: 0; }
    
    .ctrl-btn svg { width: 34px !important; height: 34px !important; }
    
    .progress-track { height: 6px; }
    .progress-area { height: 28px; }
    .progress-thumb { width: 14px; height: 14px; transform: translate(-50%, -50%) scale(1); }
    
    .volume-slider-wrap.visible { max-width: 130px; }
    .volume-slider { width: 110px; height: 6px; }
    .volume-slider::-webkit-slider-thumb { width: 16px; height: 16px; }
    
    .two-column-menu { min-width: 300px; gap: 12px; }
    
    .mobile-seek-btn { width: 65px; height: 65px; }
    .mobile-seek-btn svg { width: 45px; height: 45px; }
    .mobile-play-btn { width: 85px; height: 85px; }
    .mobile-play-btn svg { width: 55px; height: 55px; }
    
    .control-row { gap: 8px; }
    .time-display { font-size: 13px; order: 3; }
    
    /* Mobile order: Fullscreen, Quality, CC, Time */
    #fsBtn { order: 1; }
    #settingsBtn { order: 2; }
    #ccBtn { order: 3; }
    .time-display { order: 4; }
  }

  /* Fullscreen */
  :fullscreen .player-wrapper,
  :-webkit-full-screen .player-wrapper {
    height: 100vh;
    border-radius: 0;
  }
  :fullscreen .video-container,
  :-webkit-full-screen .video-container {
    height: 100%;
  }
  
  /* No zoom - prevent UI scaling */
  * {
    touch-action: manipulation;
  }
  
  /* Prevent zoom on desktop via keyboard/mouse */
  body {
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  <div class="video-container show-cursor" id="videoContainer">

    <video id="video" preload="metadata"></video>

    <div class="poster-overlay" id="posterOverlay">
      <button class="poster-play-btn" id="posterPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <div class="click-ripple" id="clickRipple"></div>
    <div class="center-icon" id="centerIcon">
      <svg id="centerIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <!-- Mobile Seek Overlays (without number 10) -->
    <div class="mobile-seek-overlay mobile-seek-left mobile-only" id="mobileSeekLeft">
      <button class="mobile-seek-btn" id="mobileSeekBackBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
      </button>
    </div>
    <div class="mobile-seek-overlay mobile-seek-right mobile-only" id="mobileSeekRight">
      <button class="mobile-seek-btn" id="mobileSeekFwdBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Center Play Button -->
    <div class="mobile-center-controls mobile-only" id="mobileCenterControls">
      <button class="mobile-play-btn" id="mobileCenterPlayBtn">
        <svg id="mobilePlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- Controls Overlay -->
    <div class="controls-overlay" id="controlsOverlay">
      <div class="progress-area" id="progressArea"
           onmousedown="startScrub(event)"
           ontouchstart="startScrub(event)"
           onmousemove="hoverProgress(event)"
           onmouseleave="leaveProgress()">
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="progress-tooltip" id="progressTooltip">0:00</div>
      </div>

      <div class="control-row">
        <!-- Volume (left side) -->
        <div class="volume-group" id="volumeGroup">
          <button class="ctrl-btn" id="muteBtn">
            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
          <div class="volume-slider-wrap" id="volumeSliderWrap">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
          </div>
        </div>

        <!-- Desktop: Play/Pause and Seek buttons -->
        <div class="desktop-play-seek">
          <button class="ctrl-btn" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="desktopRewindBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
          <button class="ctrl-btn" id="desktopFwdBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
        </div>

        <div class="spacer"></div>

        <!-- Right side items order: Fullscreen, Quality, CC, Time -->
        <button class="ctrl-btn" id="fsBtn">
          <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>

        <div style="position:relative">
          <button class="ctrl-btn" id="settingsBtn">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
          <div class="popup-menu" id="settingsMenu">
            <div class="popup-section-label">Video Quality</div>
            <div class="popup-item active" data-quality="auto"><span>Auto</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" data-quality="1080"><span>1080p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" data-quality="720"><span>720p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" data-quality="480"><span>480p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" data-quality="360"><span>360p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          </div>
        </div>

        <div style="position:relative">
          <button class="ctrl-btn" id="ccBtn">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 9H9.5v-.5h-2v3h2V15H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V15H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
          </button>
          <div class="popup-menu two-column-menu" id="ccMenu">
            <div class="menu-column">
              <div class="popup-section-label">Subtitles</div>
              <div class="popup-item active" data-cc="off"><span>Off</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-cc="ku"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-cc="en"><span>English</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-cc="ar"><span>Arabic</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-cc="fa"><span>Persian</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            </div>
            <div class="menu-column">
              <div class="popup-section-label">Audio Track</div>
              <div class="popup-item active" data-audio="original"><span>Original</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-audio="ku"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              <div class="popup-item" data-audio="en"><span>English</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            </div>
          </div>
        </div>

        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>
  </div>
</div>

<script>
// DEMO CHUNKS
const DEMO_CHUNKS = [
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 60 },
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 60 },
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 60 },
];

// DOM Elements
const video = document.getElementById('video');
const container = document.getElementById('videoContainer');
const progressArea = document.getElementById('progressArea');
const progressFill = document.getElementById('progressFill');
const progressBuffer = document.getElementById('progressBuffer');
const progressThumb = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const playIcon = document.getElementById('playIcon');
const volIcon = document.getElementById('volIcon');
const timeDisplay = document.getElementById('timeDisplay');
const controlsOverlay = document.getElementById('controlsOverlay');
const loadingOverlay = document.getElementById('loadingOverlay');
const posterOverlay = document.getElementById('posterOverlay');
const centerIconDiv = document.getElementById('centerIcon');
const centerIconSvg = document.getElementById('centerIconSvg');
const clickRipple = document.getElementById('clickRipple');
const volumeSliderWrap = document.getElementById('volumeSliderWrap');
const volumeSlider = document.getElementById('volumeSlider');

// State
let chunks = [];
let currentChunkIndex = 0;
let totalDuration = 0;
let chunkStartTimes = [];
let isScrubbing = false;
let controlsTimer = null;
let isVideoStarted = false;
let volumeVisible = false;
let volumeHideTimer = null;

// Init
function initPlayer(config) {
  chunks = config.chunks || DEMO_CHUNKS;
  preloadChunkDurations();
}

async function preloadChunkDurations() {
  chunkStartTimes = [0];
  totalDuration = 0;
  for (let i = 0; i < chunks.length; i++) {
    const d = chunks[i].duration || 10;
    totalDuration += d;
    chunkStartTimes.push(totalDuration);
  }
}

function startVideo() {
  if (isVideoStarted) return;
  posterOverlay.classList.add('hidden');
  isVideoStarted = true;
  loadChunk(0);
  video.addEventListener('canplay', () => { video.play().catch(e=>console.log); }, { once: true });
  showControls();
}

function loadChunk(index) {
  if (index < 0 || index >= chunks.length) return;
  currentChunkIndex = index;
  video.src = chunks[index].url;
  video.load();
  setLoading(true);
  video.play().catch(() => {});
}

function onChunkEnd() {
  if (currentChunkIndex < chunks.length - 1) {
    loadChunk(currentChunkIndex + 1);
  } else {
    setPlayIcon(false);
    posterOverlay.classList.remove('hidden');
    isVideoStarted = false;
  }
}

function togglePlay() {
  if (!isVideoStarted) { startVideo(); return; }
  if (video.paused) {
    video.play().then(() => {
      setPlayIcon(true);
      showCenterIcon(true);
      showControls();
    }).catch(e=>console.log);
  } else {
    video.pause();
    setPlayIcon(false);
    showCenterIcon(false);
    showControls();
  }
}

function seekRelative(secs) {
  if (!isVideoStarted) return;
  const globalNow = getGlobalTime();
  let target = Math.max(0, Math.min(totalDuration, globalNow + secs));
  seekToGlobal(target);
}

function seekToGlobal(targetTime) {
  let targetChunk = chunks.length - 1;
  for (let i = 0; i < chunkStartTimes.length - 1; i++) {
    if (targetTime >= chunkStartTimes[i] && targetTime < chunkStartTimes[i + 1]) {
      targetChunk = i; break;
    }
  }
  if (targetChunk !== currentChunkIndex) {
    currentChunkIndex = targetChunk;
    video.src = chunks[targetChunk].url;
    video.load();
    video.currentTime = targetTime - chunkStartTimes[targetChunk];
    setLoading(true);
    video.play().catch(() => {});
  } else {
    video.currentTime = targetTime - chunkStartTimes[currentChunkIndex];
  }
}

function getGlobalTime() {
  return chunkStartTimes[currentChunkIndex] + (video.currentTime || 0);
}

function updateProgress() {
  if (isScrubbing || totalDuration === 0) return;
  const globalTime = getGlobalTime();
  const pct = (globalTime / totalDuration) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  const bufEnd = video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
  const bufPct = ((chunkStartTimes[currentChunkIndex] + bufEnd) / totalDuration) * 100;
  progressBuffer.style.width = Math.min(bufPct, 100) + '%';
  timeDisplay.textContent = formatTime(globalTime) + ' / ' + formatTime(totalDuration);
}

function showCenterIcon(isPlay) {
  const path = isPlay ? 'M8 5v14l11-7z' : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  centerIconSvg.querySelector('path').setAttribute('d', path);
  centerIconDiv.classList.remove('animate');
  clickRipple.classList.remove('animate');
  void centerIconDiv.offsetWidth;
  centerIconDiv.classList.add('animate');
  clickRipple.classList.add('animate');
}

function setPlayIcon(playing) {
  const d = playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z';
  if(playIcon) playIcon.querySelector('path').setAttribute('d', d);
  const mobileIcon = document.getElementById('mobilePlayIcon');
  if(mobileIcon) mobileIcon.querySelector('path').setAttribute('d', d);
}

// Volume - ONLY controls volume
function handleVolumeIconClick() {
  if (!volumeVisible) showVolumeSlider();
  else { 
    video.muted = !video.muted; 
    updateVolIcon(); 
    resetVolumeHideTimer();
  }
}

function showVolumeSlider() { 
  volumeVisible = true; 
  volumeSliderWrap.classList.add('visible'); 
  resetVolumeHideTimer(); 
}

function hideVolumeSlider() { 
  volumeVisible = false; 
  volumeSliderWrap.classList.remove('visible'); 
}

function resetVolumeHideTimer() { 
  clearTimeout(volumeHideTimer); 
  volumeHideTimer = setTimeout(hideVolumeSlider, 5000); 
}

function setVolume(val) { 
  video.volume = val / 100; 
  video.muted = (val == 0); 
  updateVolIcon(); 
}

function updateVolIcon() {
  const v = video.muted ? 0 : video.volume;
  let d = '';
  if (v === 0) d = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  else if (v < 0.5) d = 'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L7 9H5z';
  else d = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
  volIcon.querySelector('path').setAttribute('d', d);
}

function setQuality(q) {
  document.querySelectorAll('#settingsMenu .popup-item').forEach(el => {
    const val = el.getAttribute('data-quality');
    el.classList.toggle('active', val === q);
  });
  closeAllMenus();
}

function selectCC(lang) {
  document.querySelectorAll('#ccMenu .menu-column:first-child .popup-item').forEach(el => el.classList.remove('active'));
  const target = document.querySelector(`#ccMenu .popup-item[data-cc="${lang}"]`);
  if(target) target.classList.add('active');
  closeAllMenus();
}

function selectAudio(track) {
  document.querySelectorAll('#ccMenu .menu-column:last-child .popup-item').forEach(el => el.classList.remove('active'));
  const target = document.querySelector(`#ccMenu .popup-item[data-audio="${track}"]`);
  if(target) target.classList.add('active');
  closeAllMenus();
}

function toggleMenu(id) {
  const menu = document.getElementById(id);
  const isOpen = menu.classList.contains('open');
  closeAllMenus();
  if (!isOpen) menu.classList.add('open');
}

function closeAllMenus() { 
  document.querySelectorAll('.popup-menu').forEach(m => m.classList.remove('open')); 
}

// Progress scrubbing
function startScrub(e) { isScrubbing = true; scrub(e); const move = (ev) => scrub(ev); const up = () => { isScrubbing = false; document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchend', up); endScrub(); }; document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('mouseup', up); document.addEventListener('touchend', up); e.preventDefault(); }
function scrub(e) { const rect = progressArea.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left; const pct = Math.max(0, Math.min(1, x / rect.width)); progressFill.style.width = (pct * 100) + '%'; progressThumb.style.left = (pct * 100) + '%'; }
function endScrub() { const pct = parseFloat(progressFill.style.width) / 100; const targetTime = pct * totalDuration; seekToGlobal(targetTime); }
function hoverProgress(e) { const rect = progressArea.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left; const pct = Math.max(0, Math.min(1, x / rect.width)); progressTooltip.textContent = formatTime(pct * totalDuration); progressTooltip.style.right = (rect.width - x) + 'px'; progressTooltip.style.left = 'auto'; }
function leaveProgress() {}

// Controls auto-hide
function showControls() { 
  controlsOverlay.classList.remove('hidden'); 
  container.classList.add('show-cursor'); 
  const mcc = document.getElementById('mobileCenterControls'); 
  if(mcc) mcc.classList.add('visible'); 
  clearTimeout(controlsTimer); 
  if (isVideoStarted && !video.paused) { 
    controlsTimer = setTimeout(() => { 
      controlsOverlay.classList.add('hidden'); 
      container.classList.remove('show-cursor'); 
      if(mcc) mcc.classList.remove('visible'); 
    }, 3000); 
  } 
}

container.addEventListener('mousemove', showControls);
container.addEventListener('touchstart', (e) => { 
  if (controlsOverlay.classList.contains('hidden')) showControls(); 
}, { passive: true });

container.addEventListener('click', (e) => { 
  if (e.target.closest('.ctrl-btn') || e.target.closest('.progress-area') || e.target.closest('.popup-menu') || e.target.closest('.mobile-seek-btn') || e.target.closest('.mobile-play-btn')) return; 
  togglePlay(); 
});

// Video events
video.addEventListener('play', () => { setPlayIcon(true); showControls(); });
video.addEventListener('pause', () => { setPlayIcon(false); showControls(); });
video.addEventListener('ended', onChunkEnd);
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('waiting', () => setLoading(true));
video.addEventListener('canplay', () => setLoading(false));
video.addEventListener('playing', () => setLoading(false));
video.addEventListener('progress', updateProgress);

function setLoading(b) { loadingOverlay.classList.toggle('active', b); }

// Format time
function formatTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  const hours = Math.floor(s / 3600);
  const minutes = Math.floor((s % 3600) / 60);
  const seconds = Math.floor(s % 60);
  if (hours > 0) {
    return hours + ':' + minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
  }
  return minutes + ':' + seconds.toString().padStart(2, '0');
}

// Fullscreen
function toggleFullscreen() { 
  const wrap = document.getElementById('playerWrapper'); 
  if (!document.fullscreenElement) { 
    (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap); 
  } else { 
    document.exitFullscreen?.(); 
  } 
}

document.addEventListener('fullscreenchange', () => { 
  const isFs = !!document.fullscreenElement; 
  const fsIcon = document.getElementById('fsIcon');
  if(fsIcon) fsIcon.querySelector('path').setAttribute('d', isFs ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z' : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z'); 
  showControls(); 
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => { 
  if (e.target.tagName === 'INPUT') return; 
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') seekRelative(10);
  if (e.code === 'ArrowLeft') seekRelative(-10);
  if (e.code === 'ArrowUp') { video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); }
  if (e.code === 'ArrowDown') { video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); }
  if (e.code === 'KeyF') toggleFullscreen();
  if (e.code === 'KeyM') { e.preventDefault(); handleVolumeIconClick(); }
});

// Button events
document.getElementById('posterPlayBtn').onclick = () => startVideo();
document.getElementById('playBtn').onclick = () => togglePlay();
document.getElementById('desktopRewindBtn').onclick = () => seekRelative(-10);
document.getElementById('desktopFwdBtn').onclick = () => seekRelative(10);
document.getElementById('mobileSeekBackBtn').onclick = (e) => { e.stopPropagation(); seekRelative(-10); };
document.getElementById('mobileSeekFwdBtn').onclick = (e) => { e.stopPropagation(); seekRelative(10); };
document.getElementById('mobileCenterPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
document.getElementById('muteBtn').onclick = () => handleVolumeIconClick();
volumeSlider.oninput = (e) => setVolume(e.target.value);
document.getElementById('ccBtn').onclick = () => toggleMenu('ccMenu');
document.getElementById('settingsBtn').onclick = () => toggleMenu('settingsMenu');
document.getElementById('fsBtn').onclick = () => toggleFullscreen();

// CC menu items
document.querySelectorAll('#ccMenu .popup-item[data-cc]').forEach(el => { el.onclick = () => selectCC(el.getAttribute('data-cc')); });
document.querySelectorAll('#ccMenu .popup-item[data-audio]').forEach(el => { el.onclick = () => selectAudio(el.getAttribute('data-audio')); });
document.querySelectorAll('#settingsMenu .popup-item').forEach(el => { el.onclick = () => setQuality(el.getAttribute('data-quality')); });

document.addEventListener('click', (e) => { 
  if (!e.target.closest('.popup-menu') && !e.target.closest('#settingsBtn') && !e.target.closest('#ccBtn')) closeAllMenus(); 
});

// Prevent zoom on desktop (Ctrl + / Cmd +)
document.addEventListener('wheel', (e) => {
  if (e.ctrlKey) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
    e.preventDefault();
  }
  if (e.metaKey && (e.key === '+' || e.key === '-')) {
    e.preventDefault();
  }
});

// Boot
initPlayer({ chunks: DEMO_CHUNKS });
</script>
</body>
</html>
