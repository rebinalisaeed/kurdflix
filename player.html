<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kurdish Video Player - HLS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 20px 16px 16px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .controls.visible {
            opacity: 1;
            pointer-events: all;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            position: relative;
            margin-bottom: 15px;
            border-radius: 3px;
        }
        .progress-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            position: relative;
            border-radius: 3px;
        }
        .progress-thumb {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
        }
        .buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        button:hover {
            background: rgba(255,255,255,0.15);
        }
        .time {
            color: white;
            font-family: monospace;
            font-size: 14px;
            margin-left: auto;
        }
        .quality-select {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            button { font-size: 20px; padding: 8px; }
            .time { font-size: 12px; }
        }
    </style>
    <!-- HLS.js for HLS support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div class="player-container">
    <video id="video" controls></video>

    <div class="controls" id="controls">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill">
                <div class="progress-thumb"></div>
            </div>
        </div>

        <div class="buttons">
            <button id="playPauseBtn">▶</button>
            <button id="rewindBtn">⏪ 10s</button>
            <button id="forwardBtn">⏩ 10s</button>
            <button id="volumeBtn">🔊</button>
            <select id="qualitySelect" class="quality-select">
                <option value="1080">1080p</option>
                <option value="720" selected>720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
            </select>
            <span class="time" id="timeDisplay">0:00 / 0:00</span>
            <button id="fullscreenBtn">⛶</button>
        </div>
    </div>
</div>

<script>
    // ==================================================
    // 🔥 لینکەکانی خۆت لێرە دابنێ 🔥
    // بۆ فایلی HLS (.m3u8) یان فایلی ئاسایی (.mp4)
    // ==================================================
    const VIDEO_SOURCES = [
        {
            name: "بەشی 1",
            qualities: {
                "1080": "https://your-server.com/part1_1080p.m3u8",
                "720": "https://your-server.com/part1_720p.m3u8",
                "480": "https://your-server.com/part1_480p.m3u8",
                "360": "https://your-server.com/part1_360p.m3u8"
            }
        },
        {
            name: "بەشی 2",
            qualities: {
                "1080": "https://your-server.com/part2_1080p.m3u8",
                "720": "https://your-server.com/part2_720p.m3u8",
                "480": "https://your-server.com/part2_480p.m3u8",
                "360": "https://your-server.com/part2_360p.m3u8"
            }
        },
        {
            name: "بەشی 3",
            qualities: {
                "1080": "https://your-server.com/part3_1080p.m3u8",
                "720": "https://your-server.com/part3_720p.m3u8",
                "480": "https://your-server.com/part3_480p.m3u8",
                "360": "https://your-server.com/part3_360p.m3u8"
            }
        }
    ];
    // ==================================================

    let currentQuality = "720";
    let currentPartIndex = 0;
    let parts = [];
    let totalDuration = 0;
    let partStartTimes = [];
    let isScrubbing = false;
    let controlsTimer = null;
    let isPlaying = false;
    let hls = null;
    
    // DOM elements
    const video = document.getElementById('video');
    const controls = document.getElementById('controls');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const volumeBtn = document.getElementById('volumeBtn');
    const qualitySelect = document.getElementById('qualitySelect');
    const timeDisplay = document.getElementById('timeDisplay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    
    // Helper: check if URL is HLS (.m3u8)
    function isHLS(url) {
        return url && url.endsWith('.m3u8');
    }
    
    // Load video with HLS or regular MP4
    function loadVideoWithSource(url) {
        // Clean up previous HLS instance
        if (hls) {
            hls.destroy();
            hls = null;
        }
        
        if (isHLS(url)) {
            // HLS stream
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari on iOS/Mac)
                video.src = url;
            } else if (Hls.isSupported()) {
                // HLS.js for other browsers
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('HLS manifest loaded');
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS error:', data);
                });
            } else {
                console.error('HLS not supported');
            }
        } else {
            // Regular MP4
            video.src = url;
        }
    }
    
    // Get current URL
    function getCurrentUrl() {
        return VIDEO_SOURCES[currentPartIndex]?.qualities[currentQuality] || null;
    }
    
    // Initialize parts array
    function initParts() {
        parts = [];
        partStartTimes = [0];
        for (let i = 0; i < VIDEO_SOURCES.length; i++) {
            parts.push({ url: VIDEO_SOURCES[i].qualities[currentQuality], duration: 0 });
            partStartTimes.push(0);
        }
    }
    
    // Load a specific part
    function loadPart(index, seekTime = 0) {
        if (index < 0 || index >= parts.length) return;
        currentPartIndex = index;
        const url = getCurrentUrl();
        if (!url) return;
        
        loadVideoWithSource(url);
        
        // When metadata loads, update duration and seek if needed
        video.addEventListener('loadedmetadata', function onLoad() {
            video.removeEventListener('loadedmetadata', onLoad);
            if (parts[index].duration === 0) {
                parts[index].duration = video.duration;
                calculateTotalDuration();
            }
            if (seekTime > 0 && video.duration) {
                video.currentTime = Math.min(seekTime, video.duration - 0.1);
            }
            if (isPlaying) video.play();
        });
    }
    
    // Calculate total duration and start times
    function calculateTotalDuration() {
        totalDuration = 0;
        partStartTimes = [0];
        for (let i = 0; i < parts.length; i++) {
            totalDuration += parts[i].duration;
            partStartTimes.push(totalDuration);
        }
    }
    
    // Get current global time
    function getGlobalTime() {
        let localTime = video.currentTime || 0;
        return partStartTimes[currentPartIndex] + localTime;
    }
    
    // Seek to global time
    function seekToGlobal(targetTime) {
        let targetPart = 0;
        for (let i = 0; i < partStartTimes.length - 1; i++) {
            if (targetTime >= partStartTimes[i] && targetTime < partStartTimes[i+1]) {
                targetPart = i;
                break;
            }
        }
        let localTime = targetTime - partStartTimes[targetPart];
        if (targetPart !== currentPartIndex) {
            loadPart(targetPart, localTime);
        } else if (video.duration) {
            video.currentTime = Math.min(localTime, video.duration - 0.1);
        }
    }
    
    // Update progress bar and time display
    function updateProgress() {
        if (isScrubbing) return;
        let globalTime = getGlobalTime();
        let percent = totalDuration > 0 ? (globalTime / totalDuration) * 100 : 0;
        progressFill.style.width = percent + '%';
        
        let current = formatTime(globalTime);
        let total = formatTime(totalDuration);
        timeDisplay.textContent = `${current} / ${total}`;
    }
    
    // Format time (seconds to mm:ss or hh:mm:ss)
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        let hrs = Math.floor(seconds / 3600);
        let mins = Math.floor((seconds % 3600) / 60);
        let secs = Math.floor(seconds % 60);
        if (hrs > 0) {
            return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }
    
    // Change quality
    function changeQuality(quality) {
        if (quality === currentQuality) return;
        let wasPlaying = !video.paused;
        let currentTime = getGlobalTime();
        currentQuality = quality;
        
        // Update URLs in parts
        for (let i = 0; i < VIDEO_SOURCES.length; i++) {
            parts[i].url = VIDEO_SOURCES[i].qualities[currentQuality];
        }
        
        loadPart(currentPartIndex, currentTime - partStartTimes[currentPartIndex]);
        if (wasPlaying) {
            video.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        } else {
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }
    }
    
    // Event Listeners
    playPauseBtn.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            playPauseBtn.textContent = '⏸';
            isPlaying = true;
        } else {
            video.pause();
            playPauseBtn.textContent = '▶';
            isPlaying = false;
        }
    });
    
    rewindBtn.addEventListener('click', () => {
        seekToGlobal(Math.max(0, getGlobalTime() - 10));
    });
    
    forwardBtn.addEventListener('click', () => {
        seekToGlobal(Math.min(totalDuration, getGlobalTime() + 10));
    });
    
    volumeBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        volumeBtn.textContent = video.muted ? '🔇' : '🔊';
    });
    
    qualitySelect.addEventListener('change', (e) => {
        changeQuality(e.target.value);
    });
    
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });
    
    // Progress bar seeking
    progressBar.addEventListener('click', (e) => {
        let rect = progressBar.getBoundingClientRect();
        let percent = (e.clientX - rect.left) / rect.width;
        let targetTime = percent * totalDuration;
        seekToGlobal(targetTime);
    });
    
    // Video events
    video.addEventListener('timeupdate', updateProgress);
    video.addEventListener('ended', () => {
        if (currentPartIndex < parts.length - 1) {
            loadPart(currentPartIndex + 1, 0);
        } else {
            playPauseBtn.textContent = '▶';
            isPlaying = false;
        }
    });
    video.addEventListener('play', () => {
        playPauseBtn.textContent = '⏸';
        isPlaying = true;
    });
    video.addEventListener('pause', () => {
        playPauseBtn.textContent = '▶';
        isPlaying = false;
    });
    
    // Show/hide controls on mouse move
    function showControls() {
        controls.classList.add('visible');
        clearTimeout(controlsTimer);
        controlsTimer = setTimeout(() => {
            if (isPlaying) controls.classList.remove('visible');
        }, 3000);
    }
    document.addEventListener('mousemove', showControls);
    document.addEventListener('touchstart', showControls);
    
    // Initialize
    initParts();
    loadPart(0, 0);
    showControls();
</script>
</body>
</html>
