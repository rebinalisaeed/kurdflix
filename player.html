<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page: #0f0f0f;
    --bg-player: #000;
    --bg-controls: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
    --bg-progress-track: rgba(255,255,255,0.2);
    --bg-progress-buffer: rgba(255,255,255,0.35);
    --accent: #ff0000;
    --accent-hover: #cc0000;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.75);
    --text-muted: rgba(255,255,255,0.45);
    --control-hover: rgba(255,255,255,0.15);
    --tooltip-bg: rgba(28,28,28,0.95);
    --font: 'Inter', 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ====== PLAYER WRAPPER ====== */
  .player-wrapper {
    width: 100%;
    max-width: 900px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
  }

  /* ====== VIDEO CONTAINER ====== */
  .video-container {
    position: relative;
    width: 100%;
    background: #000;
    aspect-ratio: 16/9;
    overflow: hidden;
    cursor: none;
  }
  .video-container.show-cursor { cursor: default; }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ====== POSTER ====== */
  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .poster-overlay.hidden { opacity: 0; pointer-events: none; }

  .poster-title {
    font-size: clamp(16px, 3vw, 26px);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    text-align: center;
    padding: 0 20px;
  }
  .poster-play-btn {
    width: clamp(56px, 8vw, 72px);
    height: clamp(56px, 8vw, 72px);
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 8px 32px rgba(255,0,0,0.35);
  }
  .poster-play-btn:hover { transform: scale(1.1); background: var(--accent-hover); }
  .poster-play-btn svg { width: 28px; height: 28px; fill: #fff; margin-right: -3px; }

  /* ====== LOADING ====== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ====== CENTER RIPPLE ====== */
  .click-ripple {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
  }
  .click-ripple.animate { animation: ripple 0.4s ease-out forwards; }
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    width: 68px; height: 68px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
  }
  .center-icon.animate { animation: pop 0.4s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .center-icon svg { width: 32px; height: 32px; fill: #fff; }

  /* ====== CONTROLS OVERLAY ====== */
  .controls-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-controls);
    padding: 48px 14px 10px;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .controls-overlay.hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  /* ====== PROGRESS BAR ====== */
  .progress-area {
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 6px;
    padding: 0 2px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 4px;
    background: var(--bg-progress-track);
    border-radius: 2px;
    overflow: hidden;
    transition: height 0.15s;
  }
  .progress-area:hover .progress-track { height: 6px; }

  .progress-buffer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--bg-progress-buffer);
    border-radius: 2px;
    width: 0%;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    z-index: 1;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }
  .progress-area:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

  .progress-tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    transform: translateX(50%);
    background: var(--tooltip-bg);
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
  }
  .progress-area:hover .progress-tooltip { opacity: 1; }

  /* ====== CONTROL ROW ====== */
  .control-row {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn:hover { background: var(--control-hover); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ctrl-btn.large svg { width: 28px; height: 28px; }

  /* ====== VOLUME GROUP ====== */
  .volume-group {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .volume-slider-wrap {
    max-width: 0;
    overflow: hidden;
    transition: max-width 0.25s ease, opacity 0.25s;
    opacity: 0;
    display: flex;
    align-items: center;
  }
  .volume-slider-wrap.visible {
    max-width: 80px;
    opacity: 1;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 72px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin: 0 6px;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  /* Time display */
  .time-display {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
  }

  .spacer { flex: 1; }

  /* ====== POPUP MENUS ====== */
  .popup-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(22,22,22,0.97);
    border-radius: 8px;
    min-width: 150px;
    padding: 6px 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    z-index: 50;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .popup-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }

  .popup-header {
    font-size: 11px;
    color: var(--text-muted);
    padding: 6px 14px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .popup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .popup-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .popup-item.active { color: var(--accent); }
  .popup-item .check { width: 14px; height: 14px; fill: var(--accent); opacity: 0; flex-shrink: 0; }
  .popup-item.active .check { opacity: 1; }

  /* Settings popup — wider with sections */
  #settingsMenu { min-width: 200px; }
  .popup-section-label {
    font-size: 10px;
    color: var(--text-muted);
    padding: 8px 14px 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .popup-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 4px 0;
  }

  /* Tooltip on buttons */
  .btn-tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--tooltip-bg);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 60;
  }
  .ctrl-btn:hover .btn-tooltip { opacity: 1; }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 600px) {
    body { padding: 0; background: #000; }
    .player-wrapper { border-radius: 0; box-shadow: none; }
    .time-display { font-size: 11px; }
    .ctrl-btn svg { width: 20px; height: 20px; }
    .ctrl-btn.large svg { width: 24px; height: 24px; }
  }

  /* ====== FULLSCREEN ====== */
  :fullscreen .player-wrapper,
  :-webkit-full-screen .player-wrapper {
    max-width: 100vw;
    border-radius: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  :fullscreen .video-container,
  :-webkit-full-screen .video-container {
    flex: 1;
    aspect-ratio: unset;
  }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  <div class="video-container show-cursor" id="videoContainer">

    <video id="video" preload="metadata"></video>

    <!-- Poster -->
    <div class="poster-overlay" id="posterOverlay">
      <div class="poster-title" id="posterTitle">Select something to watch</div>
      <button class="poster-play-btn" onclick="startVideo()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <!-- Center ripple + icon -->
    <div class="click-ripple" id="clickRipple"></div>
    <div class="center-icon" id="centerIcon">
      <svg id="centerIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <!-- Controls -->
    <div class="controls-overlay" id="controlsOverlay">

      <!-- Progress bar -->
      <div class="progress-area" id="progressArea"
           onmousedown="startScrub(event)"
           ontouchstart="startScrub(event)"
           onmousemove="hoverProgress(event)"
           onmouseleave="leaveProgress()">
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="progress-tooltip" id="progressTooltip">0:00</div>
      </div>

      <!-- Control row -->
      <div class="control-row">

        <!-- LEFT SIDE -->

        <!-- Play/Pause -->
        <button class="ctrl-btn large" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span class="btn-tooltip">Play / Pause</span>
        </button>

        <!-- Rewind 10s -->
        <button class="ctrl-btn" onclick="seekRelative(-10)">
          <svg viewBox="0 0 24 24">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
          </svg>
          <span class="btn-tooltip">-10s</span>
        </button>

        <!-- Forward 10s -->
        <button class="ctrl-btn" onclick="seekRelative(10)">
          <svg viewBox="0 0 24 24">
            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
          </svg>
          <span class="btn-tooltip">+10s</span>
        </button>

        <!-- Volume -->
        <div class="volume-group" id="volumeGroup">
          <button class="ctrl-btn" id="muteBtn" onclick="handleVolumeIconClick()">
            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <span class="btn-tooltip">Volume</span>
          </button>
          <div class="volume-slider-wrap" id="volumeSliderWrap">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
          </div>
        </div>

        <div class="spacer"></div>

        <!-- RIGHT SIDE -->

        <!-- Subtitle / Audio tracks -->
        <div style="position:relative">
          <button class="ctrl-btn" id="ccBtn" onclick="toggleMenu('ccMenu')">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 9H9.5v-.5h-2v3h2V15H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V15H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
            <span class="btn-tooltip">Subtitles / Audio</span>
          </button>
          <div class="popup-menu" id="ccMenu">
            <div class="popup-section-label">Subtitles</div>
            <div class="popup-item active" onclick="selectCC('off')"><span>Off</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectCC('ku')"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectCC('en')"><span>English</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectCC('ar')"><span>Arabic</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectCC('fa')"><span>Persian</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-divider"></div>
            <div class="popup-section-label">Audio Track</div>
            <div class="popup-item active" onclick="selectAudio('original')"><span>Original</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectAudio('ku')"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="selectAudio('en')"><span>English</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          </div>
        </div>

        <!-- Time display -->
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>

        <!-- Settings (quality + speed) -->
        <div style="position:relative">
          <button class="ctrl-btn" id="settingsBtn" onclick="toggleMenu('settingsMenu')">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span class="btn-tooltip">Settings</span>
          </button>
          <div class="popup-menu" id="settingsMenu">
            <div class="popup-section-label">Quality</div>
            <div class="popup-item active" onclick="setQuality('auto')"><span>Auto</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setQuality('1080')"><span>1080p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setQuality('720')"><span>720p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setQuality('480')"><span>480p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setQuality('360')"><span>360p</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-divider"></div>
            <div class="popup-section-label">Playback Speed</div>
            <div class="popup-item" onclick="setSpeed(0.5)"><span>0.5×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setSpeed(0.75)"><span>0.75×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item active" onclick="setSpeed(1)"><span>Normal</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setSpeed(1.25)"><span>1.25×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setSpeed(1.5)"><span>1.5×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="popup-item" onclick="setSpeed(2)"><span>2×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          </div>
        </div>

        <!-- Fullscreen -->
        <button class="ctrl-btn" id="fsBtn" onclick="toggleFullscreen()">
          <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <span class="btn-tooltip">Fullscreen</span>
        </button>

      </div><!-- /.control-row -->
    </div><!-- /.controls-overlay -->
  </div><!-- /.video-container -->
</div><!-- /.player-wrapper -->

<script>
// ====================================================
// DEMO CHUNKS
// ====================================================
const DEMO_CHUNKS = [
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 10 },
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 10 },
  { url: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 10 },
];

// ====================================================
// DOM REFS
// ====================================================
const video           = document.getElementById('video');
const container       = document.getElementById('videoContainer');
const progressArea    = document.getElementById('progressArea');
const progressFill    = document.getElementById('progressFill');
const progressBuffer  = document.getElementById('progressBuffer');
const progressThumb   = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const progressTrack   = document.getElementById('progressTrack');
const playIcon        = document.getElementById('playIcon');
const volIcon         = document.getElementById('volIcon');
const timeDisplay     = document.getElementById('timeDisplay');
const controlsOverlay = document.getElementById('controlsOverlay');
const loadingOverlay  = document.getElementById('loadingOverlay');
const posterOverlay   = document.getElementById('posterOverlay');
const centerIcon      = document.getElementById('centerIcon');
const centerIconSvg   = document.getElementById('centerIconSvg');
const clickRipple     = document.getElementById('clickRipple');
const volumeSliderWrap = document.getElementById('volumeSliderWrap');

// ====================================================
// STATE
// ====================================================
let chunks           = [];
let currentChunkIndex = 0;
let totalDuration    = 0;
let chunkStartTimes  = [];
let isScrubbing      = false;
let controlsTimer    = null;
let isVideoStarted   = false;
let volumeVisible    = false;
let volumeHideTimer  = null;

// ====================================================
// INIT
// ====================================================
function initPlayer(config) {
  chunks = config.chunks || DEMO_CHUNKS;
  document.getElementById('metaTitle') && (document.getElementById('metaTitle').textContent = config.title || '');
  document.getElementById('posterTitle').textContent = config.title || 'Select something to watch';
  if (config.poster) {
    posterOverlay.style.backgroundImage = `url(${config.poster})`;
    posterOverlay.style.backgroundSize = 'cover';
    posterOverlay.style.backgroundPosition = 'center';
  }
  preloadChunkDurations();
}

async function preloadChunkDurations() {
  chunkStartTimes = [0];
  totalDuration = 0;
  for (let i = 0; i < chunks.length; i++) {
    const d = chunks[i].duration || 5;
    totalDuration += d;
    chunkStartTimes.push(totalDuration);
  }
}

// ====================================================
// PLAYBACK
// ====================================================
function startVideo() {
  posterOverlay.classList.add('hidden');
  isVideoStarted = true;
  loadChunk(0);
  video.addEventListener('canplay', () => { video.play(); }, { once: true });
  showControls();
}

function loadChunk(index) {
  if (index < 0 || index >= chunks.length) return;
  currentChunkIndex = index;
  video.src = chunks[index].url;
  video.load();
  setLoading(true);
  video.play().catch(() => {});
}

function onChunkEnd() {
  if (currentChunkIndex < chunks.length - 1) {
    loadChunk(currentChunkIndex + 1);
  } else {
    setPlayIcon(false);
    posterOverlay.classList.remove('hidden');
    posterOverlay.style.opacity = '1';
    isVideoStarted = false;
  }
}

function togglePlay() {
  if (!isVideoStarted) { startVideo(); return; }
  if (video.paused) {
    video.play();
    showCenterIcon(true);
  } else {
    video.pause();
    showCenterIcon(false);
  }
}

function seekRelative(secs) {
  if (!isVideoStarted) return;
  const globalNow = getGlobalTime();
  const target = Math.max(0, Math.min(totalDuration, globalNow + secs));
  seekToGlobal(target);
}

function seekToGlobal(targetTime) {
  let targetChunk = chunks.length - 1;
  for (let i = 0; i < chunkStartTimes.length - 1; i++) {
    if (targetTime >= chunkStartTimes[i] && targetTime < chunkStartTimes[i + 1]) {
      targetChunk = i; break;
    }
  }
  if (targetChunk !== currentChunkIndex) {
    currentChunkIndex = targetChunk;
    video.src = chunks[targetChunk].url;
    video.load();
    video.currentTime = targetTime - chunkStartTimes[targetChunk];
    setLoading(true);
    video.play().catch(() => {});
  } else {
    video.currentTime = targetTime - chunkStartTimes[currentChunkIndex];
  }
}

// ====================================================
// CENTER ICON
// ====================================================
function showCenterIcon(isPlay) {
  const path = isPlay ? 'M8 5v14l11-7z' : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  centerIconSvg.querySelector('path').setAttribute('d', path);
  centerIcon.classList.remove('animate');
  clickRipple.classList.remove('animate');
  void centerIcon.offsetWidth;
  centerIcon.classList.add('animate');
  clickRipple.classList.add('animate');
}

function setPlayIcon(playing) {
  playIcon.querySelector('path').setAttribute('d',
    playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z'
  );
}

// ====================================================
// VOLUME — click to show, auto-hide after 5s
// ====================================================
function handleVolumeIconClick() {
  if (!volumeVisible) {
    // Show slider
    showVolumeSlider();
  } else {
    // Mute/unmute toggle
    video.muted = !video.muted;
    updateVolIcon();
    resetVolumeHideTimer();
  }
}

function showVolumeSlider() {
  volumeVisible = true;
  volumeSliderWrap.classList.add('visible');
  resetVolumeHideTimer();
}

function hideVolumeSlider() {
  volumeVisible = false;
  volumeSliderWrap.classList.remove('visible');
}

function resetVolumeHideTimer() {
  clearTimeout(volumeHideTimer);
  volumeHideTimer = setTimeout(hideVolumeSlider, 5000);
}

document.getElementById('volumeSlider').addEventListener('input', function() {
  setVolume(this.value);
  resetVolumeHideTimer();
});

function setVolume(val) {
  video.volume = val / 100;
  video.muted = (val == 0);
  updateVolIcon();
}

function updateVolIcon() {
  const v = video.muted ? 0 : video.volume;
  let d = '';
  if (v === 0) d = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  else if (v < 0.5) d = 'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z';
  else d = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
  volIcon.querySelector('path').setAttribute('d', d);
}

// ====================================================
// QUALITY
// ====================================================
function setQuality(q) {
  document.querySelectorAll('#settingsMenu .popup-item').forEach(el => {
    const txt = el.querySelector('span').textContent.toLowerCase().replace('p','');
    el.classList.toggle('active',
      (q === 'auto' && txt === 'auto') ||
      (q !== 'auto' && txt === q)
    );
  });
  closeAllMenus();
  // In a real player, switch video source URL here based on quality
}

// ====================================================
// SUBTITLE / AUDIO
// ====================================================
function selectCC(lang) {
  document.querySelectorAll('#ccMenu .popup-section-label').forEach((lbl, i) => {
    if (i === 0) {
      let next = lbl.nextElementSibling;
      while (next && !next.classList.contains('popup-divider')) {
        next.classList.remove('active');
        next = next.nextElementSibling;
      }
    }
  });
  event.currentTarget.classList.add('active');
  closeAllMenus();
}

function selectAudio(track) {
  const divider = document.querySelector('#ccMenu .popup-divider');
  let next = divider ? divider.nextElementSibling : null;
  while (next) {
    next.classList.remove('active');
    next = next.nextElementSibling;
  }
  // Mark the clicked item active via the calling element
  // Since we use inline onclick, we reference the target differently:
  closeAllMenus();
}

// ====================================================
// SPEED
// ====================================================
function setSpeed(speed) {
  video.playbackRate = speed;
  document.querySelectorAll('#settingsMenu .popup-item').forEach(el => {
    const txt = el.querySelector('span').textContent;
    const isSpeed = txt === 'Normal' ? speed === 1 : parseFloat(txt) === speed;
    const isQuality = ['auto','1080p','720p','480p','360p'].some(q => txt.toLowerCase() === q);
    if (!isQuality) el.classList.toggle('active', isSpeed);
  });
  closeAllMenus();
}

// ====================================================
// MENUS
// ====================================================
function toggleMenu(id) {
  const menu = document.getElementById(id);
  const isOpen = menu.classList.contains('open');
  closeAllMenus();
  if (!isOpen) menu.classList.add('open');
}

function closeAllMenus() {
  document.querySelectorAll('.popup-menu').forEach(m => m.classList.remove('open'));
}

// ====================================================
// FULLSCREEN
// ====================================================
function toggleFullscreen() {
  const wrap = document.getElementById('playerWrapper');
  if (!document.fullscreenElement) {
    (wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.mozRequestFullScreen).call(wrap);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
}

document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

function onFsChange() {
  const isFs = !!document.fullscreenElement;
  document.getElementById('fsIcon').querySelector('path').setAttribute('d',
    isFs
      ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z'
      : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z'
  );
  // In fullscreen: reset hide timer so controls appear then auto-hide
  showControls();
}

// ====================================================
// PROGRESS
// ====================================================
function getGlobalTime() {
  return chunkStartTimes[currentChunkIndex] + (video.currentTime || 0);
}

function updateProgress() {
  if (isScrubbing || totalDuration === 0) return;
  const globalTime = getGlobalTime();
  const pct = (globalTime / totalDuration) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  const bufEnd = video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
  const bufPct = ((chunkStartTimes[currentChunkIndex] + bufEnd) / totalDuration) * 100;
  progressBuffer.style.width = Math.min(bufPct, 100) + '%';
  timeDisplay.textContent = formatTime(globalTime) + ' / ' + formatTime(totalDuration);
}

function hoverProgress(e) {
  const rect = progressArea.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  progressTooltip.textContent = formatTime(pct * totalDuration);
  progressTooltip.style.right = (rect.width - x) + 'px';
  progressTooltip.style.left = 'auto';
}

function leaveProgress() {}

function startScrub(e) {
  isScrubbing = true;
  scrub(e);
  const move = (ev) => scrub(ev);
  const up = () => {
    isScrubbing = false;
    document.removeEventListener('mousemove', move);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('mouseup', up);
    document.removeEventListener('touchend', up);
    endScrub();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('mouseup', up);
  document.addEventListener('touchend', up);
  e.preventDefault();
}

function scrub(e) {
  const rect = progressArea.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  progressFill.style.width = (pct * 100) + '%';
  progressThumb.style.left = (pct * 100) + '%';
}

function endScrub() {
  const pct = parseFloat(progressFill.style.width) / 100;
  const targetTime = pct * totalDuration;
  seekToGlobal(targetTime);
}

// ====================================================
// CONTROLS AUTO-HIDE
// ====================================================
function showControls() {
  controlsOverlay.classList.remove('hidden');
  container.classList.add('show-cursor');
  clearTimeout(controlsTimer);
  if (isVideoStarted && !video.paused) {
    controlsTimer = setTimeout(() => {
      controlsOverlay.classList.add('hidden');
      container.classList.remove('show-cursor');
    }, 3000);
  }
}

container.addEventListener('mousemove', showControls);
container.addEventListener('touchstart', () => {
  if (controlsOverlay.classList.contains('hidden')) showControls();
  else togglePlay();
}, { passive: true });

container.addEventListener('click', (e) => {
  if (e.target.closest('.ctrl-btn') || e.target.closest('.progress-area') || e.target.closest('.popup-menu')) return;
  togglePlay();
});

// ====================================================
// VIDEO EVENTS
// ====================================================
video.addEventListener('play',     () => { setPlayIcon(true);  showControls(); });
video.addEventListener('pause',    () => { setPlayIcon(false); showControls(); });
video.addEventListener('ended',    onChunkEnd);
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('waiting',  () => setLoading(true));
video.addEventListener('canplay',  () => setLoading(false));
video.addEventListener('playing',  () => setLoading(false));
video.addEventListener('progress', updateProgress);

function setLoading(b) {
  loadingOverlay.classList.toggle('active', b);
}

// ====================================================
// FORMAT TIME
// ====================================================
function formatTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ====================================================
// KEYBOARD SHORTCUTS
// ====================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') seekRelative(10);
  if (e.code === 'ArrowLeft')  seekRelative(-10);
  if (e.code === 'ArrowUp')    { video.volume = Math.min(1, video.volume + 0.1); document.getElementById('volumeSlider').value = video.volume * 100; updateVolIcon(); }
  if (e.code === 'ArrowDown')  { video.volume = Math.max(0, video.volume - 0.1); document.getElementById('volumeSlider').value = video.volume * 100; updateVolIcon(); }
  if (e.code === 'KeyF')  toggleFullscreen();
  if (e.code === 'KeyM')  { handleVolumeIconClick(); }
});

// Close menus on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.popup-menu') && !e.target.closest('#settingsBtn') && !e.target.closest('#ccBtn')) {
    closeAllMenus();
  }
});

// ====================================================
// BOOT
// ====================================================
initPlayer({
  title: 'Movie / Drama Title',
  chunks: DEMO_CHUNKS,
});
</script>
