<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KurdFlix - بینینی ڤیدیۆ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  /* ========== پاراستن ========== */
  body, .video-container, video {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  video {
    pointer-events: auto;
    -webkit-user-drag: none;
    user-drag: none;
  }
  
  img, video {
    -webkit-touch-callout: none;
  }

  /* ========== دیزاین ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page: #0f0f0f;
    --bg-player: #000;
    --bg-controls: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    --bg-progress-track: rgba(255,255,255,0.25);
    --bg-progress-buffer: rgba(255,255,255,0.4);
    --accent: #E50914;
    --accent-hover: #b20710;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --control-hover: rgba(255,255,255,0.12);
    --tooltip-bg: rgba(28,28,28,0.95);
    --font: 'Inter', 'Segoe UI', sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }

  .player-wrapper {
    width: 100%;
    height: 100vh;
    max-width: none;
    background: #000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .video-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .video-container.show-cursor { cursor: default; }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: scale(1);
  }

  .back-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    backdrop-filter: blur(8px);
    transition: all 0.3s;
    font-family: var(--font);
  }
  .back-btn:hover {
    background: var(--accent);
  }

  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .poster-overlay.hidden { opacity: 0; pointer-events: none; }

  .poster-play-btn {
    width: clamp(56px, 8vw, 72px);
    height: clamp(56px, 8vw, 72px);
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 8px 32px rgba(229,9,20,0.35);
  }
  .poster-play-btn:hover { transform: scale(1.1); background: var(--accent-hover); }
  .poster-play-btn svg { width: 28px; height: 28px; fill: #fff; margin-right: -3px; }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .click-ripple {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
  }
  .click-ripple.animate { animation: ripple 0.4s ease-out forwards; }
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    width: 80px; height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    backdrop-filter: blur(4px);
    transition: opacity 0.2s;
  }
  .center-icon.animate { animation: pop 0.3s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .center-icon svg { width: 44px; height: 44px; fill: #fff; margin-left: 4px; }
  
  .center-icon.hidden-center {
    opacity: 0 !important;
    pointer-events: none;
  }

  .controls-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-controls);
    padding: 48px 16px 16px;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .controls-overlay.hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  .progress-area {
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 5px;
    background: var(--bg-progress-track);
    border-radius: 3px;
    overflow: visible;
    transition: height 0.15s;
  }
  .progress-area:hover .progress-track { height: 7px; }

  .progress-buffer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--bg-progress-buffer);
    border-radius: 3px;
    width: 0%;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    z-index: 1;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }
  .progress-area:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

  .progress-tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    transform: translateX(50%);
    background: var(--tooltip-bg);
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
    font-family: monospace;
  }
  .progress-area:hover .progress-tooltip { opacity: 1; }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    justify-content: space-between;
  }

  .left-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.05s;
    flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn:hover { background: var(--control-hover); }
  .ctrl-btn:active { transform: scale(0.95); }
  
  .ctrl-btn svg { width: 32px; height: 32px; fill: currentColor; }

  @media (min-width: 769px) {
    .ctrl-btn svg { width: 40px !important; height: 40px !important; }
    .ctrl-btn { padding: 12px; }
    .time-display { font-size: 24px !important; }
    .left-controls { gap: 16px; }
    .right-controls { gap: 16px; }
  }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .volume-slider-wrap {
    max-width: 0;
    overflow: hidden;
    transition: max-width 0.25s ease, opacity 0.25s;
    opacity: 0;
    display: flex;
    align-items: center;
  }
  .volume-slider-wrap.visible {
    max-width: 120px;
    opacity: 1;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    margin: 0 10px;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  .time-display {
    font-size: 16px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    font-family: monospace;
    letter-spacing: 0.5px;
  }

  .popup-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(22,22,22,0.98);
    border-radius: 12px;
    min-width: 180px;
    padding: 8px 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
  }
  .popup-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }

  .popup-section-label {
    font-size: 10px;
    color: var(--text-muted);
    padding: 6px 14px 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-family: var(--font);
  }
  .popup-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 6px 0;
  }
  
  .two-column-menu {
    min-width: 280px;
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 8px;
  }
  .menu-column {
    flex: 1;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .menu-column:last-child { border-right: none; }
  
  .popup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    font-family: var(--font);
  }
  .popup-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .popup-item.active { color: var(--accent); }
  .popup-item .check { width: 14px; height: 14px; fill: var(--accent); opacity: 0; flex-shrink: 0; }
  .popup-item.active .check { opacity: 1; }

  .desktop-only {
    display: flex !important;
  }
  
  .mobile-only {
    display: none !important;
  }

  .mobile-center-controls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 18;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .mobile-center-controls.visible { display: flex; }
  .mobile-center-controls.hidden-mobile {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .mobile-play-btn {
    background: rgba(0,0,0,0.55);
    border: none;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: all;
    color: #fff;
    transition: background 0.15s, transform 0.1s;
    backdrop-filter: blur(8px);
  }
  .mobile-play-btn:active { transform: scale(0.92); }
  .mobile-play-btn svg { width: 50px; height: 50px; fill: currentColor; margin-left: 5px; }

  .mobile-seek-overlay {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 17;
    transition: opacity 0.2s;
  }
  .mobile-seek-left { left: 0; }
  .mobile-seek-right { right: 0; }
  
  .mobile-seek-btn {
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 60px;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: background 0.15s, transform 0.1s;
    cursor: pointer;
  }
  .mobile-seek-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.6); }
  .mobile-seek-btn svg { width: 48px; height: 48px; fill: #ffffff; }

  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
    .mobile-only { display: flex !important; }
    
    body { overflow: hidden; }
    .player-wrapper { height: 100vh; border-radius: 0; }
    
    .ctrl-btn svg { width: 36px !important; height: 36px !important; }
    .time-display { font-size: 20px !important; }
    
    .volume-group .ctrl-btn svg { width: 44px !important; height: 44px !important; }
    
    .progress-track { height: 6px; }
    .progress-area { height: 28px; }
    .progress-thumb { width: 14px; height: 14px; transform: translate(-50%, -50%) scale(1); }
    
    .volume-slider-wrap.visible { max-width: 130px; }
    .volume-slider { width: 110px; height: 6px; }
    .volume-slider::-webkit-slider-thumb { width: 16px; height: 16px; }
    
    .two-column-menu { min-width: 300px; gap: 12px; }
    
    .mobile-seek-btn { width: 65px; height: 65px; }
    .mobile-seek-btn svg { width: 45px; height: 45px; }
    .mobile-play-btn { width: 85px; height: 85px; }
    .mobile-play-btn svg { width: 55px; height: 55px; }
    
    .control-row { gap: 8px; }
    .left-controls { gap: 10px; }
    .right-controls { gap: 10px; }
    .back-btn { top: 10px; right: 10px; padding: 6px 12px; font-size: 12px; }
  }

  :fullscreen .player-wrapper,
  :-webkit-full-screen .player-wrapper {
    height: 100vh;
    border-radius: 0;
  }
  :fullscreen .video-container,
  :-webkit-full-screen .video-container {
    height: 100%;
  }
  
  * {
    touch-action: manipulation;
  }
  
  body {
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  <div class="video-container show-cursor" id="videoContainer">
    
    <button class="back-btn" onclick="window.location.href='javascript:history.back()'">← گەڕانەوە</button>

    <video id="video" preload="metadata"></video>

    <div class="poster-overlay" id="posterOverlay">
      <button class="poster-play-btn" id="posterPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <div class="click-ripple" id="clickRipple"></div>
    <div class="center-icon" id="centerIcon">
      <svg id="centerIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="mobile-seek-overlay mobile-seek-left mobile-only" id="mobileSeekLeft">
      <button class="mobile-seek-btn" id="mobileSeekBackBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
      </button>
    </div>
    <div class="mobile-seek-overlay mobile-seek-right mobile-only" id="mobileSeekRight">
      <button class="mobile-seek-btn" id="mobileSeekFwdBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
        </svg>
      </button>
    </div>

    <div class="mobile-center-controls mobile-only" id="mobileCenterControls">
      <button class="mobile-play-btn" id="mobileCenterPlayBtn">
        <svg id="mobilePlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="controls-overlay" id="controlsOverlay">
      <div class="progress-area" id="progressArea"
           onmousedown="startScrub(event)"
           ontouchstart="startScrub(event)"
           onmousemove="hoverProgress(event)"
           onmouseleave="leaveProgress()"
           onclick="handleProgressClick(event)">
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="progress-tooltip" id="progressTooltip">0:00</div>
      </div>

      <div class="control-row">
        <div class="left-controls">
          <button class="ctrl-btn desktop-only" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn desktop-only" id="desktopRewindBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
          <button class="ctrl-btn desktop-only" id="desktopFwdBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
          <div class="volume-group" id="volumeGroup">
            <button class="ctrl-btn" id="muteBtn">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="volume-slider-wrap" id="volumeSliderWrap">
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
            </div>
          </div>
        </div>

        <div class="right-controls desktop-only">
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
          <div style="position:relative">
            <button class="ctrl-btn" id="ccBtn">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H10v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h2c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H17v1c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h2c.55 0 1 .45 1 1v1z"/>
              </svg>
            </button>
            <div class="popup-menu two-column-menu" id="ccMenu">
              <div class="menu-column">
                <div class="popup-section-label">Subtitles</div>
                <div class="popup-item active" data-cc="off"><span>Off</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-cc="ku"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>

  if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U')) {
    e.preventDefault();

  }

// ========== وەرگرتنی لینکی ڤیدیۆ لە URL ==========
const urlParams = new URLSearchParams(window.location.search);
const contentId = urlParams.get('id');
const contentType = urlParams.get('type'); // 'film' or 'series'
const episodeNum = urlParams.get('episode');

let videoUrl = null;
let videoTitle = '';

async function loadVideoFromData() {
    try {
        const response = await fetch('data.json?t=' + Date.now());
        const data = await response.json();
        const movies = data.movies || [];
        
        if (contentType === 'film') {
            const film = movies.find(m => m.id == contentId && m.type === 'film');
            if (film) {
                videoUrl = film.videoUrl;
                videoTitle = film.title;
            }
        } else if (contentType === 'series') {
            const series = movies.find(m => m.id == contentId && m.type === 'series');
            if (series && series.episodes && episodeNum) {
                const episode = series.episodes.find(e => e.number == episodeNum);
                if (episode) {
                    videoUrl = episode.videoUrl;
                    videoTitle = `${series.title} - ئەڵقەی ${episodeNum}`;
                }
            } else if (series) {
                videoUrl = series.videoUrl;
                videoTitle = series.title;
            }
        }
        
        if (videoUrl) {
            initPlayer(videoUrl);
        } else {
            console.error('ڤیدیۆ نەدۆزرایەوە');
            document.getElementById('posterOverlay').innerHTML = '<div style="color:white; text-align:center;"><p>ڤیدیۆ نەدۆزرایەوە</p><button onclick="window.location.href=\'index.html\'" style="background:#E50914; border:none; padding:10px 20px; border-radius:5px; color:white; margin-top:20px;">گەڕانەوە بۆ پەڕەی سەرەکی</button></div>';
        }
    } catch (error) {
        console.error('Error loading video data:', error);
    }
}

// ========== پلەیەر ==========
let hls = null;
let isScrubbing = false;
let controlsTimer = null;
let isVideoStarted = false;

const video = document.getElementById('video');
const container = document.getElementById('videoContainer');

const mobileSeekLeft = document.getElementById('mobileSeekLeft');
const mobileSeekRight = document.getElementById('mobileSeekRight');

function isHLS(url) {
    return url && url.endsWith('.m3u8');
}

function initPlayer(url) {
    if (hls) { hls.destroy(); hls = null; }
    if (isHLS(url)) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        } else if (Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else { video.src = url; }
    } else { video.src = url; }
}

function startVideo() {
    if (isVideoStarted) return;
    posterOverlay.classList.add('hidden');
    isVideoStarted = true;
    video.play().catch(() => {});
    hideAllControls();
}

function togglePlay() {
    if (!isVideoStarted) { startVideo(); setTimeout(() => showAllControls(), 100); return; }
    if (video.paused) {
        video.play().then(() => { setPlayIcon(true); showCenterIcon(true); showAllControls(); }).catch(() => {});
    } else {
        video.pause();
        setPlayIcon(false); showCenterIcon(false); showAllControls();
    }
}

function seekRelative(secs) {
    if (!isVideoStarted) return;
    video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + secs));
    showAllControls();
}

function updateProgress() {
    if (isScrubbing || !isVideoStarted || !video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    if (video.buffered.length > 0) {
        const bufPct = (video.buffered.end(video.buffered.length-1) / video.duration) * 100;
        progressBuffer.style.width = Math.min(bufPct, 100) + '%';
    }
    const ft = formatTime(video.currentTime);
    const ftt = formatTime(video.duration);
    if (timeDisplay) timeDisplay.textContent = ft + ' / ' + ftt;
    if (timeDisplayMobile) timeDisplayMobile.textContent = ft + ' / ' + ftt;
}

function formatTime(s) {
    if (isNaN(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sc = Math.floor(s % 60);
    return m + ':' + sc.toString().padStart(2, '0');
}

function hideAllControls() {
    controlsOverlay.classList.add('hidden');
    container.classList.remove('show-cursor');
    if (mobileCenterControls) { mobileCenterControls.classList.remove('visible'); mobileCenterControls.classList.add('hidden-mobile'); }
    if (mobileSeekLeft) mobileSeekLeft.style.opacity = '0';
    if (mobileSeekRight) mobileSeekRight.style.opacity = '0';
    centerIconDiv.classList.add('hidden-center');
    clearTimeout(controlsTimer);
}

function showAllControls() {
    controlsOverlay.classList.remove('hidden');
    container.classList.add('show-cursor');
    if (mobileCenterControls) { mobileCenterControls.classList.add('visible'); mobileCenterControls.classList.remove('hidden-mobile'); }
    if (mobileSeekLeft) mobileSeekLeft.style.opacity = '1';
    if (mobileSeekRight) mobileSeekRight.style.opacity = '1';
    centerIconDiv.classList.remove('hidden-center');
    clearTimeout(controlsTimer);
    if (isVideoStarted && !video.paused) controlsTimer = setTimeout(() => hideAllControls(), 3000);
}

function showCenterIcon(isPlay) {
    const path = isPlay ? 'M8 5v14l11-7z' : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
    centerIconSvg.querySelector('path').setAttribute('d', path);
    centerIconDiv.classList.remove('animate');
    clickRipple.classList.remove('animate');
    void centerIconDiv.offsetWidth;
    centerIconDiv.classList.add('animate');
    clickRipple.classList.add('animate');
}

function setPlayIcon(playing) {
    const d = playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z';
    if (playIcon) playIcon.querySelector('path').setAttribute('d', d);
    const mobileIcon = document.getElementById('mobilePlayIcon');
    if (mobileIcon) mobileIcon.querySelector('path').setAttribute('d', d);
}

function setLoading(b) { loadingOverlay.classList.toggle('active', b); }

function handleVolumeIconClick() {
    if (!volumeVisible) showVolumeSlider();
    else { video.muted = !video.muted; updateVolIcon(); resetVolumeHideTimer(); }
    showAllControls();
}
function showVolumeSlider() { volumeVisible = true; volumeSliderWrap.classList.add('visible'); resetVolumeHideTimer(); }
function hideVolumeSlider() { volumeVisible = false; volumeSliderWrap.classList.remove('visible'); }
function resetVolumeHideTimer() { clearTimeout(volumeHideTimer); volumeHideTimer = setTimeout(hideVolumeSlider, 5000); }
function setVolume(val) { video.volume = val / 100; video.muted = (val == 0); updateVolIcon(); }

    if (v === 0) d = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    else if (v < 0.5) d = 'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L7 9H5z';
    else d = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
    volIcon.querySelector('path').setAttribute('d', d);
}

function toggleMenu(menuId) { 
    const menu = document.getElementById(menuId); 
    const isOpen = menu.classList.contains('open'); 
    closeAllMenus(); 
    if (!isOpen) menu.classList.add('open'); 
    showAllControls(); 
}
function closeAllMenus() { document.querySelectorAll('.popup-menu').forEach(m => m.classList.remove('open')); }

function getProgressPercentFromEvent(e) {
    const rect = progressArea.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
}
function handleProgressClick(e) { 
    const pct = getProgressPercentFromEvent(e);
    video.currentTime = pct * video.duration;
    showAllControls(); 
    e.stopPropagation(); 
}
function startScrub(e) { 
    isScrubbing = true; 
    const pct = getProgressPercentFromEvent(e);
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    const move = (ev) => { if (isScrubbing) { const p = getProgressPercentFromEvent(ev); progressFill.style.width = (p * 100) + '%'; progressThumb.style.left = (p * 100) + '%'; } };
    const up = () => { if (isScrubbing) video.currentTime = parseFloat(progressFill.style.width) / 100 * video.duration; isScrubbing = false; document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchend', up); };

}
function hoverProgress(e) { 
    const pct = getProgressPercentFromEvent(e);
    progressTooltip.textContent = formatTime(pct * video.duration);
    const rect = progressArea.getBoundingClientRect();
    let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    progressTooltip.style.right = (rect.width - x) + 'px'; progressTooltip.style.left = 'auto';
}
function leaveProgress() {}

function onUserActivity() { if (isVideoStarted && !video.paused) showAllControls(); }

container.addEventListener('mousemove', onUserActivity);

    const wrap = document.getElementById('playerWrapper');

}

    const p = document.fullscreenElement ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z' : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z'; 
    document.getElementById('fsIcon')?.querySelector('path').setAttribute('d', p); 
    document.getElementById('fsIconMobile')?.querySelector('path').setAttribute('d', p); 
    showAllControls(); 
});

document.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; if (e.code === 'Space') { e.preventDefault(); togglePlay(); } if (e.code === 'ArrowRight') seekRelative(10); if (e.code === 'ArrowLeft') seekRelative(-10); if (e.code === 'ArrowUp') { video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); } if (e.code === 'ArrowDown') { video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); } if (e.code === 'KeyF') toggleFullscreen(); if (e.code === 'KeyM') { e.preventDefault(); handleVolumeIconClick(); } });

document.getElementById('posterPlayBtn').onclick = () => startVideo();
document.getElementById('playBtn').onclick = () => togglePlay();
document.getElementById('desktopRewindBtn').onclick = () => seekRelative(-10);
document.getElementById('desktopFwdBtn').onclick = () => seekRelative(10);
document.getElementById('mobileSeekBackBtn').onclick = (e) => { e.stopPropagation(); seekRelative(-10); };
document.getElementById('mobileSeekFwdBtn').onclick = (e) => { e.stopPropagation(); seekRelative(10); };
document.getElementById('mobileCenterPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
document.getElementById('muteBtn').onclick = () => handleVolumeIconClick();
volumeSlider.oninput = (e) => setVolume(e.target.value);
document.getElementById('settingsBtn').onclick = () => toggleMenu('settingsMenu');
document.getElementById('ccBtn').onclick = () => toggleMenu('ccMenu');
document.getElementById('fsBtn').onclick = () => toggleFullscreen();
document.getElementById('settingsBtnMobile').onclick = () => toggleMenu('settingsMenuMobile');
document.getElementById('ccBtnMobile').onclick = () => toggleMenu('ccMenuMobile');
document.getElementById('fsBtnMobile').onclick = () => toggleFullscreen();

document.addEventListener('click', (e) => { if (!e.target.closest('.popup-menu') && !e.target.closest('#settingsBtn') && !e.target.closest('#ccBtn') && !e.target.closest('#settingsBtnMobile') && !e.target.closest('#ccBtnMobile')) closeAllMenus(); });

// Initialize
loadVideoFromData();
if (mobileCenterControls) mobileCenterControls.classList.add('hidden-mobile');
if (mobileSeekLeft) mobileSeekLeft.style.opacity = '0';
if (mobileSeekRight) mobileSeekRight.style.opacity = '0';
centerIconDiv.classList.add('hidden-center');
</script>
