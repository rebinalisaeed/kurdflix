<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پلەیەری پیشەیی - فیلم و دراما</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* کانتەینی سەرەکی پلەیەر */
        .premium-player-container {
            max-width: 1400px;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* شوێنی ڤیدیۆ - بەرزی دوو هێندە لەسەر کۆمپیوتەر */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            min-height: 60vh;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }

        /* Control Bar */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 20px 16px 12px 16px;
            transition: opacity 0.3s ease;
            opacity: 1;
            z-index: 10;
        }

        /* Progress Bar - ئەستوری دوو هێندە */
        .progress-bar-container {
            width: 100%;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 12px;
        }

        .progress-track {
            background-color: rgba(255, 255, 255, 0.3);
            height: 6px;
            border-radius: 3px;
            position: relative;
            transition: height 0.2s;
        }

        .progress-track:hover {
            height: 8px;
        }

        .progress-fill {
            background-color: #ff0000;
            height: 100%;
            width: 0%;
            border-radius: 3px;
            position: relative;
        }

        .progress-handle {
            width: 14px;
            height: 14px;
            background-color: #ff0000;
            border-radius: 50%;
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-track:hover .progress-handle {
            opacity: 1;
        }

        /* ڕیزی سەرەکی کۆنتڕۆڵەکان */
        .controls-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* دوگمەی 10 چرکە بە کەوانەیی */
        .seek-btn {
            position: relative;
            font-size: 20px;
        }
        
        .seek-btn span {
            position: absolute;
            font-size: 10px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .time-display {
            color: white;
            font-size: 14px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* پۆپ ئەپی دەنگ - ئاسۆیی */
        .volume-popup {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(28, 28, 28, 0.95);
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .volume-popup.show {
            display: flex;
        }

        .volume-popup input {
            width: 100px;
            height: 4px;
        }

        /* مینیو کوالێتی و ژێرنووس/دەنگ (ئێستا یەک ئایکۆن بۆ ژێرنووس و دەنگ) */
        .quality-menu, .media-menu {
            position: absolute;
            bottom: 50px;
            right: 0;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 140px;
            display: none;
            z-index: 20;
        }

        .quality-menu.show, .media-menu.show {
            display: block;
        }

        .quality-menu div, .media-menu div {
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .quality-menu div:hover, .media-menu div:hover {
            background: #ff0000;
        }

        .relative-wrapper {
            position: relative;
        }

        /* پلەیەری مۆبایل - ستایلە تایبەتەکان */
        @media (max-width: 768px) {
            .premium-player-container {
                border-radius: 0;
            }
            
            video {
                max-height: 60vh;
                min-height: 50vh;
            }
            
            /* دوگمە گەورەکانی ناوەڕاست بۆ مۆبایل */
            .mobile-center-buttons {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 40px;
                z-index: 15;
                pointer-events: none;
            }
            
            .mobile-center-buttons .control-btn {
                pointer-events: auto;
                width: 60px;
                height: 60px;
                background: rgba(0,0,0,0.6);
                backdrop-filter: blur(4px);
                font-size: 28px;
            }
            
            .mobile-center-buttons .seek-btn {
                font-size: 24px;
            }
            
            .mobile-center-buttons .seek-btn span {
                font-size: 12px;
            }
            
            /* تاسک باڕەکەی مۆبایل */
            .custom-controls {
                padding: 12px 12px 8px 12px;
            }
            
            .controls-main-row {
                gap: 8px;
            }
            
            .controls-left, .controls-right {
                gap: 8px;
            }
            
            .control-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            
            .time-display {
                font-size: 11px;
            }
            
            .volume-popup {
                bottom: 40px;
                left: -10px;
            }
            
            .volume-popup input {
                width: 80px;
            }
        }
        
        /* ستایلی کۆمپیوتەر */
        @media (min-width: 769px) {
            .video-wrapper {
                min-height: 70vh;
            }
            
            video {
                max-height: 75vh;
            }
            
            .mobile-center-buttons {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="premium-player-container">
    <div class="video-wrapper">
        <video id="mainVideo" poster="https://via.placeholder.com/1280x720/1a1a2e/ffffff?text=ڤیدیۆ"></video>
        
        <!-- دوگمە گەورەکانی ناوەڕاست - تەنها بۆ مۆبایل دەردەکەون -->
        <div class="mobile-center-buttons" id="mobileCenterBtns">
            <button class="control-btn seek-btn" id="mobileBackwardBtn">
                <i class="fas fa-backward-step"></i>
                <span>10</span>
            </button>
            <button class="control-btn" id="mobilePlayPauseBtn">
                <i class="fas fa-play" id="mobilePlayIcon"></i>
            </button>
            <button class="control-btn seek-btn" id="mobileForwardBtn">
                <i class="fas fa-forward-step"></i>
                <span>10</span>
            </button>
        </div>
        
        <div class="custom-controls" id="controlsBar">
            <div class="progress-bar-container" id="progressBar">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-handle"></div>
                </div>
            </div>

            <div class="controls-main-row">
                <div class="controls-left">
                    <!-- دوگمەی دەنگ -->
                    <div class="relative-wrapper" id="volumeWrapper">
                        <button class="control-btn" id="volumeBtn">
                            <i class="fas fa-volume-up" id="volumeIcon"></i>
                        </button>
                        <div class="volume-popup" id="volumePopup">
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                </div>

                <div class="controls-right">
                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                    </div>

                    <!-- ئایکۆنی ژێرنووس و دەنگ پێکەوە -->
                    <div class="relative-wrapper" id="mediaWrapper">
                        <button class="control-btn" id="mediaBtn">
                            <i class="fas fa-closed-captioning"></i>
                        </button>
                        <div class="media-menu" id="mediaMenu">
                            <div style="font-weight: bold; border-bottom: 1px solid #444;">📺 ژێرنووس</div>
                            <div data-sub="off">ناڵێن (لابردن)</div>
                            <div data-sub="ku">کوردی</div>
                            <div data-sub="en">English</div>
                            <div data-sub="ar">العربية</div>
                            <div data-sub="fa">فارسی</div>
                            <div style="font-weight: bold; border-bottom: 1px solid #444; margin-top: 8px;">🎧 دەنگ</div>
                            <div data-audio="en">English</div>
                            <div data-audio="ku">کوردی</div>
                            <div data-audio="ar">العربية</div>
                        </div>
                    </div>

                    <!-- کوالێتی -->
                    <div class="relative-wrapper" id="qualityWrapper">
                        <button class="control-btn" id="qualityBtn">
                            <i class="fas fa-gear"></i>
                        </button>
                        <div class="quality-menu" id="qualityMenu">
                            <div data-quality="auto">Auto</div>
                            <div data-quality="1080">1080p</div>
                            <div data-quality="720">720p</div>
                            <div data-quality="480">480p</div>
                            <div data-quality="360">360p</div>
                        </div>
                    </div>

                    <!-- فولسکرین -->
                    <button class="control-btn" id="fullscreenBtn">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // === گۆڕاوەکان ===
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const forward10Btn = document.getElementById('forward10Btn');
    const backward10Btn = document.getElementById('backward10Btn');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const volumePopup = document.getElementById('volumePopup');
    const volumeSlider = document.getElementById('volumeSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const qualityBtn = document.getElementById('qualityBtn');
    const qualityMenu = document.getElementById('qualityMenu');
    const mediaBtn = document.getElementById('mediaBtn');
    const mediaMenu = document.getElementById('mediaMenu');
    const controlsBar = document.getElementById('controlsBar');
    
    // دوگمەکانی مۆبایل
    const mobilePlayPauseBtn = document.getElementById('mobilePlayPauseBtn');
    const mobilePlayIcon = document.getElementById('mobilePlayIcon');
    const mobileBackwardBtn = document.getElementById('mobileBackwardBtn');
    const mobileForwardBtn = document.getElementById('mobileForwardBtn');
    
    let controlsTimeout;
    let hls;
    let currentQuality = 'auto';
    
    // === لینکی ڤیدیۆی HLS (m3u8) ===
    const videoUrl = 'https://your-telegram-bot.com/path/to/your/file.m3u8'; // <-- بگۆڕە بۆ لینکی خۆت
    
    function initHLS(url, quality = 'auto') {
        if (hls) hls.destroy();
        if (Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if (quality !== 'auto') {
                    const levels = hls.levels;
                    const idx = levels.findIndex(l => l.height === parseInt(quality));
                    if (idx !== -1) hls.currentLevel = idx;
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        } else {
            alert('براوسەری تۆ پشتیوانی HLS نییە');
        }
    }
    initHLS(videoUrl, currentQuality);
    
    // === کۆنترۆڵکردنی دەرکەوتنی کۆنتڕۆڵ ===
    function hideControls() { if (!video.paused) controlsBar.style.opacity = '0'; }
    function showControls() {
        controlsBar.style.opacity = '1';
        clearTimeout(controlsTimeout);
        if (!video.paused) controlsTimeout = setTimeout(hideControls, 5000);
    }
    
    document.querySelector('.video-wrapper').addEventListener('mousemove', showControls);
    document.querySelector('.video-wrapper').addEventListener('mouseleave', () => {
        if (!video.paused) controlsBar.style.opacity = '0';
    });
    
    // === فەرمانی پلەی/ڕاگرتن (هاوکات بۆ هەردوو دوگمە) ===
    function togglePlay() {
        if (video.paused) {
            video.play();
            playPauseIcon.className = 'fas fa-pause';
            if (mobilePlayIcon) mobilePlayIcon.className = 'fas fa-pause';
            showControls();
        } else {
            video.pause();
            playPauseIcon.className = 'fas fa-play';
            if (mobilePlayIcon) mobilePlayIcon.className = 'fas fa-play';
            showControls();
        }
    }
    
    playPauseBtn?.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);
    if (mobilePlayPauseBtn) mobilePlayPauseBtn.addEventListener('click', togglePlay);
    
    // === 10 چرکە بەرەو پێش و دواوە ===
    function seekForward() { video.currentTime = Math.min(video.duration, video.currentTime + 10); showControls(); }
    function seekBackward() { video.currentTime = Math.max(0, video.currentTime - 10); showControls(); }
    
    forward10Btn?.addEventListener('click', seekForward);
    backward10Btn?.addEventListener('click', seekBackward);
    if (mobileForwardBtn) mobileForwardBtn.addEventListener('click', seekForward);
    if (mobileBackwardBtn) mobileBackwardBtn.addEventListener('click', seekBackward);
    
    // === Progress Bar ===
    video.addEventListener('timeupdate', () => {
        const percent = (video.currentTime / video.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeSpan.textContent = formatTime(video.currentTime);
    });
    video.addEventListener('loadedmetadata', () => { durationSpan.textContent = formatTime(video.duration); });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
        showControls();
    });
    
    // === دەنگ - پۆپ ئەپی ئاسۆیی ===
    volumeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        volumePopup.classList.toggle('show');
        setTimeout(() => volumePopup.classList.remove('show'), 5000);
    });
    volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        updateVolumeIcon();
    });
    function updateVolumeIcon() {
        if (video.volume === 0) volumeIcon.className = 'fas fa-volume-mute';
        else if (video.volume < 0.5) volumeIcon.className = 'fas fa-volume-down';
        else volumeIcon.className = 'fas fa-volume-up';
    }
    let popupTimeout;
    volumePopup.addEventListener('mouseenter', () => clearTimeout(popupTimeout));
    volumePopup.addEventListener('mouseleave', () => { popupTimeout = setTimeout(() => volumePopup.classList.remove('show'), 300); });
    
    // === فولسکرین ===
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
        } else {
            document.exitFullscreen();
            fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
        else fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
    });
    
    // === کوالێتی ===
    qualityBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        qualityMenu.classList.toggle('show');
        setTimeout(() => qualityMenu.classList.remove('show'), 5000);
    });
    document.querySelectorAll('[data-quality]').forEach(item => {
        item.addEventListener('click', (e) => {
            const quality = e.target.getAttribute('data-quality');
            currentQuality = quality;
            if (hls) {
                if (quality === 'auto') hls.currentLevel = -1;
                else {
                    const idx = hls.levels.findIndex(l => l.height === parseInt(quality));
                    if (idx !== -1) hls.currentLevel = idx;
                }
            }
            qualityMenu.classList.remove('show');
        });
    });
    
    // === مینیوی یەکگرتووی ژێرنووس و دەنگ ===
    mediaBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        mediaMenu.classList.toggle('show');
        setTimeout(() => mediaMenu.classList.remove('show'), 5000);
    });
    document.querySelectorAll('[data-sub]').forEach(item => {
        item.addEventListener('click', (e) => {
            const lang = e.target.getAttribute('data-sub');
            alert(`ژێرنووس بۆ ${lang} هەڵبژێردرا (پێویستە فایلەکە زیاد بکەیت)`);
            mediaMenu.classList.remove('show');
        });
    });
    document.querySelectorAll('[data-audio]').forEach(item => {
        item.addEventListener('click', (e) => {
            const audioLang = e.target.getAttribute('data-audio');
            alert(`دەنگ بۆ ${audioLang} هەڵبژێردرا`);
            mediaMenu.classList.remove('show');
        });
    });
    
    // === داخستنی مینیوکان ===
    document.addEventListener('click', () => {
        qualityMenu.classList.remove('show');
        mediaMenu.classList.remove('show');
        volumePopup.classList.remove('show');
    });
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }
    
    showControls();
</script>
</body>
</html>
