<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kurdish Video Player - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: 'NRT';
    src: url('fonts/NRT-Bd.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }
  
  @font-face {
    font-family: 'NRT';
    src: url('fonts/NRT-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --bg-page: #0f0f0f;
    --bg-player: #000;
    --bg-controls: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    --bg-progress-track: rgba(255,255,255,0.25);
    --bg-progress-buffer: rgba(255,255,255,0.4);
    --accent: #ff0000;
    --accent-hover: #cc0000;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --control-hover: rgba(255,255,255,0.12);
    --tooltip-bg: rgba(28,28,28,0.95);
    --font: 'NRT', 'Inter', 'Segoe UI', sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }

  body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    overflow: hidden;
    touch-action: pan-x pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  * {
    -webkit-tap-highlight-color: transparent;
  }

  .player-wrapper {
    width: 100%;
    height: 100vh;
    max-width: none;
    background: #000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .video-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .video-container.show-cursor { cursor: default; }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: scale(1);
    pointer-events: none;
  }

  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .poster-overlay.hidden { opacity: 0; pointer-events: none; }

  .poster-play-btn {
    width: clamp(56px, 8vw, 72px);
    height: clamp(56px, 8vw, 72px);
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 8px 32px rgba(255,0,0,0.35);
  }
  .poster-play-btn:hover { transform: scale(1.1); background: var(--accent-hover); }
  .poster-play-btn svg { width: 28px; height: 28px; fill: #fff; margin-right: -3px; }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .click-ripple {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
  }
  .click-ripple.animate { animation: ripple 0.4s ease-out forwards; }
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    width: 80px; height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    backdrop-filter: blur(4px);
    transition: opacity 0.2s;
  }
  .center-icon.animate { animation: pop 0.3s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .center-icon svg { width: 44px; height: 44px; fill: #fff; margin-left: 4px; }
  
  .center-icon.hidden-center {
    opacity: 0 !important;
    pointer-events: none;
  }

  .controls-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-controls);
    padding: 48px 16px 16px;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .controls-overlay.hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  .progress-area {
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 5px;
    background: var(--bg-progress-track);
    border-radius: 3px;
    overflow: visible;
    transition: height 0.15s;
  }
  .progress-area:hover .progress-track { height: 7px; }

  .progress-buffer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--bg-progress-buffer);
    border-radius: 3px;
    width: 0%;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    z-index: 1;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }
  .progress-area:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

  .progress-tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    transform: translateX(50%);
    background: var(--tooltip-bg);
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
    font-family: monospace;
  }
  .progress-area:hover .progress-tooltip { opacity: 1; }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    justify-content: space-between;
  }

  .left-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.05s;
    flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn:hover { background: var(--control-hover); }
  .ctrl-btn:active { transform: scale(0.95); }
  
  .ctrl-btn svg { width: 32px; height: 32px; fill: currentColor; }

  @media (min-width: 769px) {
    .ctrl-btn svg { width: 40px !important; height: 40px !important; }
    .ctrl-btn { padding: 12px; }
    .time-display { font-size: 24px !important; }
    .left-controls { gap: 16px; }
    .right-controls { gap: 16px; }
  }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .volume-slider-wrap {
    max-width: 0;
    overflow: hidden;
    transition: max-width 0.25s ease, opacity 0.25s;
    opacity: 0;
    display: flex;
    align-items: center;
  }
  .volume-slider-wrap.visible {
    max-width: 120px;
    opacity: 1;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    margin: 0 10px;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  .time-display {
    font-size: 16px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    font-family: monospace;
    letter-spacing: 0.5px;
  }

  .popup-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(22,22,22,0.98);
    border-radius: 12px;
    min-width: 180px;
    padding: 8px 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
  }
  .popup-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }

  .popup-section-label {
    font-size: 10px;
    color: var(--text-muted);
    padding: 6px 14px 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-family: var(--font);
  }
  .popup-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 6px 0;
  }
  
  .two-column-menu {
    min-width: 280px;
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 8px;
  }
  .menu-column {
    flex: 1;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .menu-column:last-child { border-right: none; }
  
  .popup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    font-family: var(--font);
  }
  .popup-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .popup-item.active { color: var(--accent); }
  .popup-item .check { width: 14px; height: 14px; fill: var(--accent); opacity: 0; flex-shrink: 0; }
  .popup-item.active .check { opacity: 1; }

  .desktop-only {
    display: flex !important;
  }
  
  .mobile-only {
    display: none !important;
  }

  .mobile-center-controls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 18;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .mobile-center-controls.visible { display: flex; }
  .mobile-center-controls.hidden-mobile {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .mobile-play-btn {
    background: rgba(0,0,0,0.55);
    border: none;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: all;
    color: #fff;
    transition: background 0.15s, transform 0.1s;
    backdrop-filter: blur(8px);
  }
  .mobile-play-btn:active { transform: scale(0.92); }
  .mobile-play-btn svg { width: 50px; height: 50px; fill: currentColor; margin-left: 5px; }

  .mobile-seek-overlay {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 17;
    transition: opacity 0.2s;
  }
  .mobile-seek-left { left: 0; }
  .mobile-seek-right { right: 0; }
  
  .mobile-seek-btn {
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 60px;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: background 0.15s, transform 0.1s;
    cursor: pointer;
  }
  .mobile-seek-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.6); }
  .mobile-seek-btn svg { width: 48px; height: 48px; fill: #ffffff; }

  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
    .mobile-only { display: flex !important; }
    
    body { overflow: hidden; }
    .player-wrapper { height: 100vh; border-radius: 0; }
    
    .ctrl-btn svg { width: 36px !important; height: 36px !important; }
    .time-display { font-size: 20px !important; }
    
    .volume-group .ctrl-btn svg { width: 44px !important; height: 44px !important; }
    
    .progress-track { height: 6px; }
    .progress-area { height: 28px; }
    .progress-thumb { width: 14px; height: 14px; transform: translate(-50%, -50%) scale(1); }
    
    .volume-slider-wrap.visible { max-width: 130px; }
    .volume-slider { width: 110px; height: 6px; }
    .volume-slider::-webkit-slider-thumb { width: 16px; height: 16px; }
    
    .two-column-menu { min-width: 300px; gap: 12px; }
    
    .mobile-seek-btn { width: 65px; height: 65px; }
    .mobile-seek-btn svg { width: 45px; height: 45px; }
    .mobile-play-btn { width: 85px; height: 85px; }
    .mobile-play-btn svg { width: 55px; height: 55px; }
    
    .control-row { gap: 8px; }
    .left-controls { gap: 10px; }
    .right-controls { gap: 10px; }
  }

  :fullscreen .player-wrapper,
  :-webkit-full-screen .player-wrapper {
    height: 100vh;
    border-radius: 0;
  }
  :fullscreen .video-container,
  :-webkit-full-screen .video-container {
    height: 100%;
  }
  
  * {
    touch-action: manipulation;
  }
  
  body {
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  <div class="video-container show-cursor" id="videoContainer">

    <video id="video" preload="metadata"></video>

    <div class="poster-overlay" id="posterOverlay">
      <button class="poster-play-btn" id="posterPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <div class="click-ripple" id="clickRipple"></div>
    <div class="center-icon" id="centerIcon">
      <svg id="centerIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="mobile-seek-overlay mobile-seek-left mobile-only" id="mobileSeekLeft">
      <button class="mobile-seek-btn" id="mobileSeekBackBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
      </button>
    </div>
    <div class="mobile-seek-overlay mobile-seek-right mobile-only" id="mobileSeekRight">
      <button class="mobile-seek-btn" id="mobileSeekFwdBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
        </svg>
      </button>
    </div>

    <div class="mobile-center-controls mobile-only" id="mobileCenterControls">
      <button class="mobile-play-btn" id="mobileCenterPlayBtn">
        <svg id="mobilePlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="controls-overlay" id="controlsOverlay">
      <div class="progress-area" id="progressArea"
           onmousedown="startScrub(event)"
           ontouchstart="startScrub(event)"
           onmousemove="hoverProgress(event)"
           onmouseleave="leaveProgress()"
           onclick="handleProgressClick(event)">
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="progress-tooltip" id="progressTooltip">0:00</div>
      </div>

      <div class="control-row">
        <div class="left-controls">
          <button class="ctrl-btn desktop-only" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn desktop-only" id="desktopRewindBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
          <button class="ctrl-btn desktop-only" id="desktopFwdBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
              <text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" font-family="sans-serif" font-weight="bold">10</text>
            </svg>
          </button>
          <div class="volume-group" id="volumeGroup">
            <button class="ctrl-btn" id="muteBtn">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="volume-slider-wrap" id="volumeSliderWrap">
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
            </div>
          </div>
        </div>

        <div class="right-controls desktop-only">
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
          <div style="position:relative">
            <button class="ctrl-btn" id="ccBtn">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 9H9.5v-.5h-2v3h2V15H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V15H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
            </button>
            <div class="popup-menu two-column-menu" id="ccMenu">
              <div class="menu-column">
                <div class="popup-section-label">Subtitles</div>
                <div class="popup-item active" data-cc="off"><span>Off</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-cc="ku"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-cc="en"><span>English</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-cc="ar"><span>Arabic</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-cc="fa"><span>Persian</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
              </div>
              <div class="menu-column">
                <div class="popup-section-label">Audio Track</div>
                <div class="popup-item active" data-audio="original"><span>Original</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="popup-item" data-audio="ku"><span>Kurdish</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>

<script>
// ====================================================
// VIDEO SOURCES - Configure your videos here
// Each video has 4 quality options (1080p, 720p, 480p, 360p)
// Duration will be auto-detected by the player
// ====================================================
const VIDEO_SOURCES = [
  {
    name: "Video 1",
    qualities: {
      "1080": "YOUR_TELEGRAM_VIDEO_1080_URL_1",
      "720": "YOUR_TELEGRAM_VIDEO_720_URL_1", 
      "480": "YOUR_TELEGRAM_VIDEO_480_URL_1",
      "360": "YOUR_TELEGRAM_VIDEO_360_URL_1"
    }
  },
  {
    name: "Video 2",
    qualities: {
      "1080": "YOUR_TELEGRAM_VIDEO_1080_URL_2",
      "720": "YOUR_TELEGRAM_VIDEO_720_URL_2",
      "480": "YOUR_TELEGRAM_VIDEO_480_URL_2",
      "360": "YOUR_TELEGRAM_VIDEO_360_URL_2"
    }
  },
  {
    name: "Video 3",
    qualities: {
      "1080": "YOUR_TELEGRAM_VIDEO_1080_URL_3",
      "720": "YOUR_TELEGRAM_VIDEO_720_URL_3",
      "480": "YOUR_TELEGRAM_VIDEO_480_URL_3",
      "360": "YOUR_TELEGRAM_VIDEO_360_URL_3"
    }
  }
];

// Current quality setting
let currentQuality = "1080";

// DOM Elements
const video = document.getElementById('video');
const container = document.getElementById('videoContainer');
const progressArea = document.getElementById('progressArea');
const progressFill = document.getElementById('progressFill');
const progressBuffer = document.getElementById('progressBuffer');
const progressThumb = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const playIcon = document.getElementById('playIcon');
const volIcon = document.getElementById('volIcon');
const timeDisplay = document.getElementById('timeDisplay');
const timeDisplayMobile = document.getElementById('timeDisplayMobile');
const controlsOverlay = document.getElementById('controlsOverlay');
const loadingOverlay = document.getElementById('loadingOverlay');
const posterOverlay = document.getElementById('posterOverlay');
const centerIconDiv = document.getElementById('centerIcon');
const centerIconSvg = document.getElementById('centerIconSvg');
const clickRipple = document.getElementById('clickRipple');
const volumeSliderWrap = document.getElementById('volumeSliderWrap');
const volumeSlider = document.getElementById('volumeSlider');
const mobileCenterControls = document.getElementById('mobileCenterControls');
const mobileSeekLeft = document.getElementById('mobileSeekLeft');
const mobileSeekRight = document.getElementById('mobileSeekRight');

// State
let chunks = [];
let currentChunkIndex = 0;
let totalDuration = 0;
let chunkStartTimes = [];
let isScrubbing = false;
let controlsTimer = null;
let isVideoStarted = false;
let volumeVisible = false;
let volumeHideTimer = null;
let isLoadingChunk = false;
let durationsLoaded = false;
let durationsToLoad = 0;

// Get URL for current quality
function getCurrentQualityUrl(chunkIndex) {
  const videoData = VIDEO_SOURCES[chunkIndex];
  if (!videoData) return null;
  return videoData.qualities[currentQuality];
}

// Auto-detect video duration
function loadVideoDuration(url, index) {
  return new Promise((resolve, reject) => {
    const tempVideo = document.createElement('video');
    tempVideo.preload = 'metadata';
    tempVideo.onloadedmetadata = function() {
      const duration = tempVideo.duration;
      tempVideo.src = '';
      resolve({ index, duration });
    };
    tempVideo.onerror = function() {
      tempVideo.src = '';
      resolve({ index, duration: 10 }); // fallback to 10 seconds
    };
    tempVideo.src = url;
  });
}

// Load all durations
async function loadAllDurations() {
  durationsToLoad = VIDEO_SOURCES.length;
  let loadedCount = 0;
  
  for (let i = 0; i < VIDEO_SOURCES.length; i++) {
    const url = getCurrentQualityUrl(i);
    if (url && url !== "YOUR_TELEGRAM_VIDEO_1080_URL_1" && !url.includes("YOUR_TELEGRAM")) {
      const result = await loadVideoDuration(url, i);
      chunks[result.index] = { url: getCurrentQualityUrl(result.index), duration: result.duration };
      loadedCount++;
    } else {
      // Fallback for demo
      chunks[i] = { url: getCurrentQualityUrl(i) || 'https://www.w3schools.com/html/mov_bbb.mp4', duration: 10 };
      loadedCount++;
    }
  }
  
  calculateChunkTimes();
  durationsLoaded = true;
}

// Calculate cumulative times
function calculateChunkTimes() {
  chunkStartTimes = [0];
  totalDuration = 0;
  for (let i = 0; i < chunks.length; i++) {
    const duration = chunks[i].duration || 10;
    totalDuration += duration;
    chunkStartTimes.push(totalDuration);
  }
}

// Change quality
function setQuality(quality, isMobile = false) {
  if (!isVideoStarted) {
    currentQuality = quality;
    updateQualityMenuUI(quality, isMobile);
    closeAllMenus();
    return;
  }
  
  const currentTime = getGlobalTime();
  currentQuality = quality;
  
  // Reload all chunks with new quality
  for (let i = 0; i < VIDEO_SOURCES.length; i++) {
    chunks[i] = { url: getCurrentQualityUrl(i), duration: chunks[i]?.duration || 10 };
  }
  
  updateQualityMenuUI(quality, isMobile);
  closeAllMenus();
  
  // Reload current video at same position
  const targetChunk = currentChunkIndex;
  const localTime = currentTime - chunkStartTimes[currentChunkIndex];
  
  video.src = getCurrentQualityUrl(targetChunk);
  video.load();
  setLoading(true);
  
  video.addEventListener('loadedmetadata', function onLoad() {
    video.removeEventListener('loadedmetadata', onLoad);
    const seekLocal = Math.min(localTime, video.duration - 0.05);
    if (seekLocal > 0) {
      video.currentTime = seekLocal;
    }
    if (!video.paused) {
      video.play().catch(() => {});
    }
    setLoading(false);
  });
}

function updateQualityMenuUI(quality, isMobile = false) {
  const menuId = isMobile ? '#settingsMenuMobile' : '#settingsMenu';
  document.querySelectorAll(menuId + ' .popup-item').forEach(el => {
    const val = el.getAttribute('data-quality');
    el.classList.toggle('active', val === quality);
  });
}

// Initialize chunks array
function initChunks() {
  chunks = [];
  for (let i = 0; i < VIDEO_SOURCES.length; i++) {
    chunks.push({ url: getCurrentQualityUrl(i), duration: null });
  }
}

// Start video
function startVideo() {
  if (isVideoStarted) return;
  posterOverlay.classList.add('hidden');
  isVideoStarted = true;
  currentChunkIndex = 0;
  
  if (!durationsLoaded) {
    loadAllDurations().then(() => {
      loadChunk(0);
    });
  } else {
    loadChunk(0);
  }
  hideAllControls();
}

function loadChunk(index, seekTime = 0) {
  if (index < 0 || index >= chunks.length) return;
  if (isLoadingChunk) return;
  isLoadingChunk = true;
  
  currentChunkIndex = index;
  const chunk = chunks[index];
  
  if (!chunk || !chunk.url || chunk.url.includes("YOUR_TELEGRAM")) {
    // Fallback for demo
    chunk.url = 'https://www.w3schools.com/html/mov_bbb.mp4';
    chunk.duration = 10;
  }
  
  video.onended = null;
  video.src = chunk.url;
  video.load();
  setLoading(true);
  
  const onMetadata = function() {
    video.removeEventListener('loadedmetadata', onMetadata);
    
    if (chunk.duration === null || chunk.duration === undefined) {
      chunk.duration = video.duration;
      calculateChunkTimes();
    }
    
    const maxTime = video.duration - 0.05;
    const targetSeek = Math.min(seekTime, maxTime);
    if (targetSeek > 0) {
      video.currentTime = targetSeek;
    }
    
    if (!video.paused) {
      video.play().catch(e => console.log('Play error:', e));
    }
    isLoadingChunk = false;
    setLoading(false);
  };
  
  video.addEventListener('loadedmetadata', onMetadata);
  
  video.addEventListener('error', function onError() {
    video.removeEventListener('error', onError);
    isLoadingChunk = false;
    setLoading(false);
  });
  
  video.onended = function() {
    onChunkEnd();
  };
}

function onChunkEnd() {
  if (currentChunkIndex < chunks.length - 1) {
    const nextChunkIndex = currentChunkIndex + 1;
    loadChunk(nextChunkIndex, 0);
    hideAllControls();
  } else {
    setPlayIcon(false);
    posterOverlay.classList.remove('hidden');
    isVideoStarted = false;
    currentChunkIndex = 0;
    hideAllControls();
  }
}

function togglePlay() {
  if (!isVideoStarted) { 
    startVideo(); 
    setTimeout(() => showAllControls(), 100);
    return; 
  }
  if (video.paused) {
    video.play().then(() => {
      setPlayIcon(true);
      showCenterIcon(true);
      showAllControls();
    }).catch(e => console.log(e));
  } else {
    video.pause();
    setPlayIcon(false);
    showCenterIcon(false);
    showAllControls();
  }
}

function seekRelative(secs) {
  if (!isVideoStarted) return;
  const globalNow = getGlobalTime();
  let target = Math.max(0, Math.min(totalDuration, globalNow + secs));
  seekToGlobal(target);
  showAllControls();
}

function seekToGlobal(targetTime) {
  if (totalDuration === 0) return;
  
  let targetChunk = 0;
  for (let i = 0; i < chunkStartTimes.length - 1; i++) {
    if (targetTime >= chunkStartTimes[i] && targetTime < chunkStartTimes[i + 1]) {
      targetChunk = i;
      break;
    }
  }
  if (targetChunk >= chunks.length) targetChunk = chunks.length - 1;
  
  const localTime = targetTime - chunkStartTimes[targetChunk];
  
  if (targetChunk !== currentChunkIndex) {
    currentChunkIndex = targetChunk;
    const chunk = chunks[targetChunk];
    video.src = chunk.url;
    video.load();
    setLoading(true);
    
    video.addEventListener('loadedmetadata', function onLoad() {
      video.removeEventListener('loadedmetadata', onLoad);
      const seekLocal = Math.min(localTime, video.duration - 0.05);
      video.currentTime = Math.max(0, seekLocal);
      if (!video.paused) {
        video.play().catch(() => {});
      }
      setLoading(false);
    });
  } else {
    const seekLocal = Math.min(localTime, video.duration - 0.05);
    video.currentTime = Math.max(0, seekLocal);
  }
}

function getGlobalTime() {
  if (!isVideoStarted) return 0;
  const localTime = video.currentTime || 0;
  const chunkStart = chunkStartTimes[currentChunkIndex] || 0;
  return chunkStart + localTime;
}

function updateProgress() {
  if (isScrubbing || totalDuration === 0 || !isVideoStarted) return;
  
  const globalTime = getGlobalTime();
  const pct = (globalTime / totalDuration) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  
  if (video.buffered.length > 0) {
    const bufEnd = video.buffered.end(video.buffered.length - 1);
    const globalBufferEnd = (chunkStartTimes[currentChunkIndex] || 0) + bufEnd;
    const bufPct = (globalBufferEnd / totalDuration) * 100;
    progressBuffer.style.width = Math.min(bufPct, 100) + '%';
  }
  
  const formattedTime = formatTime(globalTime);
  const formattedTotal = formatTime(totalDuration);
  if (timeDisplay) timeDisplay.textContent = formattedTime + ' / ' + formattedTotal;
  if (timeDisplayMobile) timeDisplayMobile.textContent = formattedTime + ' / ' + formattedTotal;
}

function hideAllControls() {
  controlsOverlay.classList.add('hidden');
  container.classList.remove('show-cursor');
  if (mobileCenterControls) {
    mobileCenterControls.classList.remove('visible');
    mobileCenterControls.classList.add('hidden-mobile');
  }
  if (mobileSeekLeft) mobileSeekLeft.style.opacity = '0';
  if (mobileSeekRight) mobileSeekRight.style.opacity = '0';
  centerIconDiv.classList.add('hidden-center');
  clearTimeout(controlsTimer);
}

function showAllControls() {
  controlsOverlay.classList.remove('hidden');
  container.classList.add('show-cursor');
  if (mobileCenterControls) {
    mobileCenterControls.classList.add('visible');
    mobileCenterControls.classList.remove('hidden-mobile');
  }
  if (mobileSeekLeft) mobileSeekLeft.style.opacity = '1';
  if (mobileSeekRight) mobileSeekRight.style.opacity = '1';
  centerIconDiv.classList.remove('hidden-center');
  
  clearTimeout(controlsTimer);
  if (isVideoStarted && !video.paused) {
    controlsTimer = setTimeout(() => {
      hideAllControls();
    }, 3000);
  }
}

function showCenterIcon(isPlay) {
  const path = isPlay ? 'M8 5v14l11-7z' : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  centerIconSvg.querySelector('path').setAttribute('d', path);
  centerIconDiv.classList.remove('animate');
  clickRipple.classList.remove('animate');
  void centerIconDiv.offsetWidth;
  centerIconDiv.classList.add('animate');
  clickRipple.classList.add('animate');
}

function setPlayIcon(playing) {
  const d = playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z';
  if(playIcon) playIcon.querySelector('path').setAttribute('d', d);
  const mobileIcon = document.getElementById('mobilePlayIcon');
  if(mobileIcon) mobileIcon.querySelector('path').setAttribute('d', d);
}

// Volume
function handleVolumeIconClick() {
  if (!volumeVisible) showVolumeSlider();
  else { 
    video.muted = !video.muted; 
    updateVolIcon(); 
    resetVolumeHideTimer();
  }
  showAllControls();
}

function showVolumeSlider() { 
  volumeVisible = true; 
  volumeSliderWrap.classList.add('visible'); 
  resetVolumeHideTimer(); 
}

function hideVolumeSlider() { 
  volumeVisible = false; 
  volumeSliderWrap.classList.remove('visible'); 
}

function resetVolumeHideTimer() { 
  clearTimeout(volumeHideTimer); 
  volumeHideTimer = setTimeout(hideVolumeSlider, 5000); 
}

function setVolume(val) { 
  video.volume = val / 100; 
  video.muted = (val == 0); 
  updateVolIcon(); 
}

function updateVolIcon() {
  const v = video.muted ? 0 : video.volume;
  let d = '';
  if (v === 0) d = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  else if (v < 0.5) d = 'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L7 9H5z';
  else d = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
  volIcon.querySelector('path').setAttribute('d', d);
}

function selectCC(lang, isMobile = false) {
  const menuId = isMobile ? '#ccMenuMobile' : '#ccMenu';
  document.querySelectorAll(menuId + ' .menu-column:first-child .popup-item').forEach(el => el.classList.remove('active'));
  const target = document.querySelector(menuId + ' .popup-item[data-cc="' + lang + '"]');
  if(target) target.classList.add('active');
  closeAllMenus();
  showAllControls();
}

function selectAudio(track, isMobile = false) {
  const menuId = isMobile ? '#ccMenuMobile' : '#ccMenu';
  document.querySelectorAll(menuId + ' .menu-column:last-child .popup-item').forEach(el => el.classList.remove('active'));
  const target = document.querySelector(menuId + ' .popup-item[data-audio="' + track + '"]');
  if(target) target.classList.add('active');
  closeAllMenus();
  showAllControls();
}

function toggleMenu(menuId) {
  const menu = document.getElementById(menuId);
  const isOpen = menu.classList.contains('open');
  closeAllMenus();
  if (!isOpen) menu.classList.add('open');
  showAllControls();
}

function closeAllMenus() { 
  document.querySelectorAll('.popup-menu').forEach(m => m.classList.remove('open')); 
}

// Progress handling
function getProgressPercentFromEvent(e) {
  const rect = progressArea.getBoundingClientRect();
  let clientX;
  if (e.touches) {
    clientX = e.touches[0].clientX;
  } else if (e.clientX !== undefined) {
    clientX = e.clientX;
  } else {
    clientX = e.pageX;
  }
  let x = clientX - rect.left;
  x = Math.max(0, Math.min(rect.width, x));
  return x / rect.width;
}

function handleProgressClick(e) {
  const percent = getProgressPercentFromEvent(e);
  const targetTime = percent * totalDuration;
  seekToGlobal(targetTime);
  showAllControls();
  e.stopPropagation();
}

function startScrub(e) { 
  isScrubbing = true; 
  const percent = getProgressPercentFromEvent(e);
  progressFill.style.width = (percent * 100) + '%';
  progressThumb.style.left = (percent * 100) + '%';
  
  const move = (ev) => { 
    if (!isScrubbing) return;
    const pct = getProgressPercentFromEvent(ev);
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
  };
  
  const up = () => { 
    if (isScrubbing) {
      const pct = parseFloat(progressFill.style.width) / 100;
      const targetTime = pct * totalDuration;
      seekToGlobal(targetTime);
    }
    isScrubbing = false; 
    document.removeEventListener('mousemove', move); 
    document.removeEventListener('touchmove', move); 
    document.removeEventListener('mouseup', up); 
    document.removeEventListener('touchend', up); 
  };
  
  document.addEventListener('mousemove', move); 
  document.addEventListener('touchmove', move, { passive: false }); 
  document.addEventListener('mouseup', up); 
  document.addEventListener('touchend', up); 
  e.preventDefault(); 
}

function hoverProgress(e) { 
  const percent = getProgressPercentFromEvent(e);
  progressTooltip.textContent = formatTime(percent * totalDuration); 
  const rect = progressArea.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let x = clientX - rect.left;
  progressTooltip.style.right = (rect.width - x) + 'px'; 
  progressTooltip.style.left = 'auto'; 
}

function leaveProgress() {}

function onUserActivity() {
  if (isVideoStarted && !video.paused) {
    showAllControls();
  }
}

container.addEventListener('mousemove', onUserActivity);
container.addEventListener('touchstart', (e) => { 
  onUserActivity();
}, { passive: true });

container.addEventListener('click', (e) => { 
  if (e.target.closest('.ctrl-btn') || e.target.closest('.progress-area') || e.target.closest('.popup-menu') || e.target.closest('.mobile-seek-btn') || e.target.closest('.mobile-play-btn')) return; 
  togglePlay(); 
});

video.addEventListener('play', () => { setPlayIcon(true); });
video.addEventListener('pause', () => { setPlayIcon(false); showAllControls(); });
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('waiting', () => setLoading(true));
video.addEventListener('canplay', () => setLoading(false));
video.addEventListener('playing', () => setLoading(false));
video.addEventListener('progress', updateProgress);
video.addEventListener('loadedmetadata', updateProgress);

function setLoading(b) { loadingOverlay.classList.toggle('active', b); }

function formatTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  const minutes = Math.floor(s / 60);
  const seconds = Math.floor(s % 60);
  return minutes + ':' + seconds.toString().padStart(2, '0');
}

function toggleFullscreen() { 
  const wrap = document.getElementById('playerWrapper'); 
  if (!document.fullscreenElement) { 
    (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap); 
  } else { 
    document.exitFullscreen?.(); 
  }
  showAllControls();
}

document.addEventListener('fullscreenchange', () => { 
  const isFs = !!document.fullscreenElement; 
  const fsIcon = document.getElementById('fsIcon');
  const fsIconMobile = document.getElementById('fsIconMobile');
  const path = isFs ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z' : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
  if(fsIcon) fsIcon.querySelector('path').setAttribute('d', path);
  if(fsIconMobile) fsIconMobile.querySelector('path').setAttribute('d', path);
  showAllControls(); 
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => { 
  if (e.target.tagName === 'INPUT') return; 
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') seekRelative(10);
  if (e.code === 'ArrowLeft') seekRelative(-10);
  if (e.code === 'ArrowUp') { video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); showAllControls(); }
  if (e.code === 'ArrowDown') { video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume * 100; updateVolIcon(); showAllControls(); }
  if (e.code === 'KeyF') toggleFullscreen();
  if (e.code === 'KeyM') { e.preventDefault(); handleVolumeIconClick(); }
});

// Button events
document.getElementById('posterPlayBtn').onclick = () => startVideo();
document.getElementById('playBtn').onclick = () => togglePlay();
document.getElementById('desktopRewindBtn').onclick = () => seekRelative(-10);
document.getElementById('desktopFwdBtn').onclick = () => seekRelative(10);
document.getElementById('mobileSeekBackBtn').onclick = (e) => { e.stopPropagation(); seekRelative(-10); };
document.getElementById('mobileSeekFwdBtn').onclick = (e) => { e.stopPropagation(); seekRelative(10); };
document.getElementById('mobileCenterPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
document.getElementById('muteBtn').onclick = () => handleVolumeIconClick();
volumeSlider.oninput = (e) => setVolume(e.target.value);

document.getElementById('settingsBtn').onclick = () => toggleMenu('settingsMenu');
document.getElementById('ccBtn').onclick = () => toggleMenu('ccMenu');
document.getElementById('fsBtn').onclick = () => toggleFullscreen();

document.getElementById('settingsBtnMobile').onclick = () => toggleMenu('settingsMenuMobile');
document.getElementById('ccBtnMobile').onclick = () => toggleMenu('ccMenuMobile');
document.getElementById('fsBtnMobile').onclick = () => toggleFullscreen();

// Quality menu items
document.querySelectorAll('#settingsMenu .popup-item').forEach(el => {
  el.onclick = () => setQuality(el.getAttribute('data-quality'), false);
});
document.querySelectorAll('#settingsMenuMobile .popup-item').forEach(el => {
  el.onclick = () => setQuality(el.getAttribute('data-quality'), true);
});

// CC menu items
document.querySelectorAll('#ccMenu .popup-item[data-cc]').forEach(el => { el.onclick = () => selectCC(el.getAttribute('data-cc'), false); });
document.querySelectorAll('#ccMenu .popup-item[data-audio]').forEach(el => { el.onclick = () => selectAudio(el.getAttribute('data-audio'), false); });
document.querySelectorAll('#ccMenuMobile .popup-item[data-cc]').forEach(el => { el.onclick = () => selectCC(el.getAttribute('data-cc'), true); });
document.querySelectorAll('#ccMenuMobile .popup-item[data-audio]').forEach(el => { el.onclick = () => selectAudio(el.getAttribute('data-audio'), true); });

document.addEventListener('click', (e) => { 
  if (!e.target.closest('.popup-menu') && !e.target.closest('#settingsBtn') && !e.target.closest('#ccBtn') && !e.target.closest('#settingsBtnMobile') && !e.target.closest('#ccBtnMobile')) closeAllMenus(); 
});

// Disable right click
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  return false;
});

document.addEventListener('selectstart', (e) => {
  e.preventDefault();
  return false;
});

// Prevent zoom
document.addEventListener('wheel', (e) => {
  if (e.ctrlKey) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
    e.preventDefault();
  }
  if (e.metaKey && (e.key === '+' || e.key === '-')) {
    e.preventDefault();
  }
});

// Initial setup
initChunks();
if (mobileCenterControls) mobileCenterControls.classList.add('hidden-mobile');
if (mobileSeekLeft) mobileSeekLeft.style.opacity = '0';
if (mobileSeekRight) mobileSeekRight.style.opacity = '0';
centerIconDiv.classList.add('hidden-center');
</script>
</body>
</html>
