<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KurdFlix - بینینی ڤیدیۆ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #0f0f0f;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .player-wrapper {
    width: 100%;
    height: 100vh;
    background: #000;
    position: relative;
  }
  
  .video-container {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: none;
  }
  
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  
  .back-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    backdrop-filter: blur(8px);
    transition: all 0.3s;
  }
  .back-btn:hover {
    background: #E50914;
  }
  
  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .poster-overlay.hidden { opacity: 0; pointer-events: none; }
  
  .poster-play-btn {
    width: 72px;
    height: 72px;
    background: #E50914;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
    box-shadow: 0 8px 32px rgba(229,9,20,0.35);
  }
  .poster-play-btn:hover { transform: scale(1.1); }
  .poster-play-btn svg { width: 32px; height: 32px; fill: #fff; margin-right: -3px; }
  
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  
  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #E50914;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .controls-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    padding: 48px 16px 16px;
    transition: opacity 0.3s;
    z-index: 20;
  }
  .controls-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  .progress-area {
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .progress-track {
    position: relative;
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
  }
  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: #E50914;
    border-radius: 3px;
    width: 0%;
  }
  
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  
  .left-controls, .right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .ctrl-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    border-radius: 8px;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn svg { width: 28px; height: 28px; fill: currentColor; }
  
  .time-display {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    font-family: monospace;
  }
  
  .volume-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .volume-slider {
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    -webkit-appearance: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  
  @media (max-width: 768px) {
    .ctrl-btn svg { width: 32px; height: 32px; }
    .time-display { font-size: 12px; }
    .volume-slider { width: 60px; }
    .back-btn { top: 10px; right: 10px; padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="player-wrapper">
  <div class="video-container" id="videoContainer">
    <button class="back-btn" onclick="window.location.href='javascript:history.back()'">← گەڕانەوە</button>
    
    <video id="video" preload="metadata"></video>
    
    <div class="poster-overlay" id="posterOverlay">
      <button class="poster-play-btn" id="posterPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>
    
    <div class="controls-overlay" id="controlsOverlay">
      <div class="progress-area" id="progressArea">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      
      <div class="control-row">
        <div class="left-controls">
          <button class="ctrl-btn" id="playBtn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="volume-group">
            <button class="ctrl-btn" id="muteBtn">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
          </div>
        </div>
        <div class="right-controls">
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
          <button class="ctrl-btn" id="fsBtn">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// وەرگرتنی لینکی ڤیدیۆ لە URL
const urlParams = new URLSearchParams(window.location.search);
const contentId = urlParams.get('id');
const contentType = urlParams.get('type');
const episodeNum = urlParams.get('episode');

let videoUrl = null;
let hls = null;
let isVideoStarted = false;
let controlsTimer = null;

const video = document.getElementById('video');
const container = document.getElementById('videoContainer');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const controlsOverlay = document.getElementById('controlsOverlay');
const loadingOverlay = document.getElementById('loadingOverlay');
const posterOverlay = document.getElementById('posterOverlay');
const playIcon = document.getElementById('playBtn').querySelector('svg path');

async function loadVideoFromData() {
    try {
        const response = await fetch('data.json?t=' + Date.now());
        const data = await response.json();
        const movies = data.movies || [];
        
        if (contentType === 'film') {
            const film = movies.find(m => m.id == contentId && m.type === 'film');
            if (film) videoUrl = film.videoUrl;
        } else if (contentType === 'series') {
            const series = movies.find(m => m.id == contentId && m.type === 'series');
            if (series && series.episodes && episodeNum) {
                const episode = series.episodes.find(e => e.number == episodeNum);
                if (episode) videoUrl = episode.videoUrl;
            } else if (series) {
                videoUrl = series.videoUrl;
            }
        }
        
        if (videoUrl) {
            initPlayer(videoUrl);
        } else {
            posterOverlay.innerHTML = '<div style="color:white; text-align:center;"><p>ڤیدیۆ نەدۆزرایەوە</p><button onclick="window.location.href=\'index.html\'" style="background:#E50914; border:none; padding:10px 20px; border-radius:5px; color:white; margin-top:20px;">گەڕانەوە</button></div>';
        }
    } catch (error) {
        console.error('Error loading video data:', error);
    }
}

function isHLS(url) {
    return url && (url.endsWith('.m3u8') || url.includes('.m3u8'));
}

function initPlayer(url) {
    if (hls) { hls.destroy(); hls = null; }
    if (isHLS(url)) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        } else if (Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else { video.src = url; }
    } else { video.src = url; }
}

function startVideo() {
    if (isVideoStarted) return;
    posterOverlay.classList.add('hidden');
    isVideoStarted = true;
    video.play().catch(() => {});
    hideControls();
}

function togglePlay() {
    if (!isVideoStarted) { startVideo(); showControls(); return; }
    if (video.paused) {
        video.play();
        showControls();
    } else {
        video.pause();
        showControls();
    }
}

function updateProgress() {
    if (!isVideoStarted || !video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    progressFill.style.width = pct + '%';
    timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
}

function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sc = Math.floor(s % 60);
    return m + ':' + sc.toString().padStart(2, '0');
}

function hideControls() {
    controlsOverlay.classList.add('hidden');
    container.style.cursor = 'none';
    clearTimeout(controlsTimer);
}

function showControls() {
    controlsOverlay.classList.remove('hidden');
    container.style.cursor = 'default';
    clearTimeout(controlsTimer);
    if (isVideoStarted && !video.paused) {
        controlsTimer = setTimeout(() => hideControls(), 3000);
    }
}

function setVolume(val) {
    video.volume = val / 100;
    video.muted = (val === 0);
}

function toggleFullscreen() {
    const wrapper = document.querySelector('.player-wrapper');
    if (!document.fullscreenElement) {
        wrapper.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

// Event Listeners
video.addEventListener('play', () => {
    const d = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
    playIcon.setAttribute('d', d);
});
video.addEventListener('pause', () => {
    const d = 'M8 5v14l11-7z';
    playIcon.setAttribute('d', d);
});
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('waiting', () => loadingOverlay.classList.add('active'));
video.addEventListener('canplay', () => loadingOverlay.classList.remove('active'));
video.addEventListener('playing', () => loadingOverlay.classList.remove('active'));

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('posterPlayBtn').onclick = startVideo;
document.getElementById('muteBtn').onclick = () => { video.muted = !video.muted; };
document.getElementById('volumeSlider').oninput = (e) => setVolume(e.target.value);
document.getElementById('fsBtn').onclick = toggleFullscreen;

document.getElementById('progressArea').onclick = (e) => {
    if (!isVideoStarted) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const percent = x / rect.width;
    video.currentTime = percent * video.duration;
    showControls();
};

container.addEventListener('mousemove', () => { if (isVideoStarted && !video.paused) showControls(); });
container.addEventListener('click', (e) => {
    if (e.target.closest('.ctrl-btn') || e.target.closest('.progress-area')) return;
    togglePlay();
});

loadVideoFromData();
</script>
</body>
</html>
