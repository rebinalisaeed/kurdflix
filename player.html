<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پلەیەری پیشەیی - فیلم و دراما</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .premium-player-container {
            max-width: 1400px;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 20px 16px 12px 16px;
            transition: opacity 0.3s ease;
            opacity: 1;
            z-index: 10;
        }

        .progress-bar-container {
            width: 100%;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 12px;
        }

        .progress-track {
            background-color: rgba(255, 255, 255, 0.3);
            height: 6px;
            border-radius: 3px;
            position: relative;
            transition: height 0.2s;
        }

        .progress-track:hover {
            height: 8px;
        }

        .progress-fill {
            background-color: #ff0000;
            height: 100%;
            width: 0%;
            border-radius: 3px;
            position: relative;
        }

        .progress-handle {
            width: 14px;
            height: 14px;
            background-color: #ff0000;
            border-radius: 50%;
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-track:hover .progress-handle {
            opacity: 1;
        }

        .controls-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .control-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* ستایلی SVG Seek Buttons - وەک هەموو ئایکۆنەکانی تر گونجاو */
        .seek-svg-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .seek-svg-btn svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .time-display {
            color: white;
            font-size: 14px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .volume-popup {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(28, 28, 28, 0.95);
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .volume-popup.show {
            display: flex;
        }

        .volume-popup input {
            width: 100px;
            height: 4px;
        }

        .quality-menu, .media-menu {
            position: absolute;
            bottom: 50px;
            right: 0;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            padding: 8px 0;
            display: none;
            z-index: 20;
        }

        /* مینیوەی کوالێتی */
        .quality-menu {
            min-width: 100px;
        }
        
        .quality-menu.show {
            display: block;
        }

        .quality-menu div {
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            text-align: center;
        }

        .quality-menu div:hover {
            background: #ff0000;
        }

        /* مینیوەی ژێرنووس و دەنگ - خشتەی دوو ستونی */
        .media-menu {
            min-width: 280px;
            padding: 12px;
        }
        
        .media-menu.show {
            display: block;
        }
        
        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .media-column {
            display: flex;
            flex-direction: column;
        }
        
        .media-column-title {
            font-weight: bold;
            color: #ff0000;
            padding: 6px 10px;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
            font-size: 13px;
            text-align: center;
        }
        
        .media-column div {
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            border-radius: 6px;
            text-align: center;
        }
        
        .media-column div:hover {
            background: #ff0000;
        }

        .relative-wrapper {
            position: relative;
        }

        /* فولسکرین دوگمە */
        .fullscreen-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ========== Desktop ========== */
        @media (min-width: 769px) {
            .video-wrapper {
                min-height: 70vh;
            }
            video {
                max-height: 75vh;
            }
            .mobile-center-buttons {
                display: none;
            }
            .control-btn {
                width: 38px;
                height: 38px;
            }
        }

        /* ========== Mobile ========== */
        @media (max-width: 768px) {
            .premium-player-container {
                border-radius: 0;
            }
            video {
                max-height: 60vh;
                min-height: 50vh;
            }
            .mobile-center-buttons {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 40px;
                z-index: 15;
                pointer-events: none;
            }
            .mobile-center-buttons .control-btn {
                pointer-events: auto;
                width: 60px;
                height: 60px;
                background: rgba(0,0,0,0.6);
                backdrop-filter: blur(4px);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mobile-center-buttons .seek-svg-btn {
                width: 48px;
                height: 48px;
            }
            .controls-left .control-btn:not(.volume-wrapper), 
            .controls-left .seek-svg-btn {
                display: none;
            }
            .custom-controls {
                padding: 12px 12px 8px 12px;
            }
            .controls-main-row {
                gap: 8px;
            }
            .controls-left, .controls-right {
                gap: 8px;
            }
            .time-display {
                font-size: 11px;
            }
            .volume-popup {
                bottom: 40px;
                left: -10px;
            }
            .volume-popup input {
                width: 80px;
            }
            .media-menu {
                min-width: 260px;
                right: 0;
                left: auto;
            }
        }
    </style>
</head>
<body>

<div class="premium-player-container">
    <div class="video-wrapper">
        <video id="mainVideo" poster="https://via.placeholder.com/1280x720/1a1a2e/ffffff?text=ڤیدیۆ"></video>
        
        <!-- دوگمە گەورەکانی ناوەڕاست بۆ مۆبایل -->
        <div class="mobile-center-buttons" id="mobileCenterBtns">
            <button class="control-btn" id="mobileBackwardBtn">
                <div class="seek-svg-btn" id="mobileBackwardSvg">${backwardSvg}</div>
            </button>
            <button class="control-btn" id="mobilePlayPauseBtn">
                <i class="fas fa-play" id="mobilePlayIcon" style="font-size: 28px; color: white;"></i>
            </button>
            <button class="control-btn" id="mobileForwardBtn">
                <div class="seek-svg-btn" id="mobileForwardSvg">${forwardSvg}</div>
            </button>
        </div>
        
        <div class="custom-controls" id="controlsBar">
            <div class="progress-bar-container" id="progressBar">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-handle"></div>
                </div>
            </div>

            <div class="controls-main-row">
                <div class="controls-left">
                    <!-- دوگمەی پلەی/ڕاگرتن (Desktop) -->
                    <button class="control-btn" id="playPauseBtn">
                        <i class="fas fa-play" id="playPauseIcon" style="font-size: 18px; color: white;"></i>
                    </button>
                    
                    <!-- 10 چرکە بەرەو دواوە - SVG (Desktop) -->
                    <button class="control-btn" id="backward10Btn">
                        <div class="seek-svg-btn" id="backwardSvgContainer"></div>
                    </button>
                    
                    <!-- 10 چرکە بەرەو پێش - SVG (Desktop) -->
                    <button class="control-btn" id="forward10Btn">
                        <div class="seek-svg-btn" id="forwardSvgContainer"></div>
                    </button>
                    
                    <!-- دەنگ -->
                    <div class="relative-wrapper" id="volumeWrapper">
                        <button class="control-btn" id="volumeBtn">
                            <i class="fas fa-volume-up" style="font-size: 18px; color: white;"></i>
                        </button>
                        <div class="volume-popup" id="volumePopup">
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                </div>

                <div class="controls-right">
                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                    </div>

                    <!-- ژێرنووس و دەنگ پێکەوە -->
                    <div class="relative-wrapper" id="mediaWrapper">
                        <button class="control-btn" id="mediaBtn">
                            <i class="fas fa-closed-captioning" style="font-size: 18px; color: white;"></i>
                        </button>
                        <div class="media-menu" id="mediaMenu">
                            <div class="media-grid">
                                <div class="media-column">
                                    <div class="media-column-title">📺 ژێرنووس</div>
                                    <div data-sub="off">ناڵێن (لابردن)</div>
                                    <div data-sub="ku">کوردی</div>
                                    <div data-sub="en">English</div>
                                    <div data-sub="ar">العربية</div>
                                    <div data-sub="fa">فارسی</div>
                                </div>
                                <div class="media-column">
                                    <div class="media-column-title">🎧 دەنگ</div>
                                    <div data-audio="en">English</div>
                                    <div data-audio="ku">کوردی</div>
                                    <div data-audio="ar">العربية</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- کوالێتی -->
                    <div class="relative-wrapper" id="qualityWrapper">
                        <button class="control-btn" id="qualityBtn">
                            <i class="fas fa-gear" style="font-size: 18px; color: white;"></i>
                        </button>
                        <div class="quality-menu" id="qualityMenu">
                            <div data-quality="auto">Auto</div>
                            <div data-quality="1080">1080p</div>
                            <div data-quality="720">720p</div>
                            <div data-quality="480">480p</div>
                            <div data-quality="360">360p</div>
                        </div>
                    </div>

                    <!-- فولسکرین -->
                    <button class="fullscreen-btn" id="fullscreenBtn">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // SVGی 10 چرکە بەرەو دواوە (پاشتر)
    const backwardSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
      <defs>
        <linearGradient id="bgGradBack" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#2d2d44"/>
          <stop offset="100%" stop-color="#0f0f1e"/>
        </linearGradient>
        <linearGradient id="arcGradBack" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>
        <filter id="glowBack">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="47" fill="url(#bgGradBack)"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff0d" stroke-width="1"/>
      <path d="M 50 17 A 33 33 0 1 0 79.5 63" fill="none" stroke="url(#arcGradBack)" stroke-width="6" stroke-linecap="round" filter="url(#glowBack)"/>
      <g transform="translate(50,17) rotate(-44)">
        <polygon points="0,-8 -7,5 7,5" fill="#60a5fa"/>
      </g>
      <text x="51" y="58" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-1">10</text>
    </svg>`;
    
    // SVGی 10 چرکە بەرەو پێش (پێشتر)
    const forwardSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
      <defs>
        <linearGradient id="bgGradFor" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#2d2d44"/>
          <stop offset="100%" stop-color="#0f0f1e"/>
        </linearGradient>
        <linearGradient id="arcGradFor" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>
        <filter id="glowFor">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="47" fill="url(#bgGradFor)"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff0d" stroke-width="1"/>
      <path d="M 50 17 A 33 33 0 1 1 20.5 63" fill="none" stroke="url(#arcGradFor)" stroke-width="6" stroke-linecap="round" filter="url(#glowFor)"/>
      <g transform="translate(50,17) rotate(44)">
        <polygon points="0,-8 7,5 -7,5" fill="#a78bfa"/>
      </g>
      <text x="51" y="58" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-1">10</text>
    </svg>`;

    // === گۆڕاوەکان ===
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const forward10Btn = document.getElementById('forward10Btn');
    const backward10Btn = document.getElementById('backward10Btn');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumePopup = document.getElementById('volumePopup');
    const volumeSlider = document.getElementById('volumeSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const qualityBtn = document.getElementById('qualityBtn');
    const qualityMenu = document.getElementById('qualityMenu');
    const mediaBtn = document.getElementById('mediaBtn');
    const mediaMenu = document.getElementById('mediaMenu');
    const controlsBar = document.getElementById('controlsBar');
    
    // SVGکان دابنێ
    document.getElementById('backwardSvgContainer').innerHTML = backwardSvg;
    document.getElementById('forwardSvgContainer').innerHTML = forwardSvg;
    
    // مۆبایل SVGکان
    const mobileBackwardBtn = document.getElementById('mobileBackwardBtn');
    const mobileForwardBtn = document.getElementById('mobileForwardBtn');
    if (mobileBackwardBtn) {
        const mobileBackSvg = backwardSvg.replace('width="38"', 'width="48"').replace('height="38"', 'height="48"');
        mobileBackwardBtn.innerHTML = `<div class="seek-svg-btn" style="width:48px;height:48px;">${mobileBackSvg}</div>`;
    }
    if (mobileForwardBtn) {
        const mobileForSvg = forwardSvg.replace('width="38"', 'width="48"').replace('height="38"', 'height="48"');
        mobileForwardBtn.innerHTML = `<div class="seek-svg-btn" style="width:48px;height:48px;">${mobileForSvg}</div>`;
    }
    
    const mobilePlayPauseBtn = document.getElementById('mobilePlayPauseBtn');
    const mobilePlayIcon = document.getElementById('mobilePlayIcon');
    
    let controlsTimeout;
    let hls;
    let currentQuality = 'auto';
    
    // === لینکی ڤیدیۆ - بگۆڕە بۆ لینکی خۆت ===
    const videoUrl = 'https://your-telegram-bot.com/path/to/your/file.m3u8';
    
    function initHLS(url, quality = 'auto') {
        if (hls) hls.destroy();
        if (Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if (quality !== 'auto') {
                    const levels = hls.levels;
                    const idx = levels.findIndex(l => l.height === parseInt(quality));
                    if (idx !== -1) hls.currentLevel = idx;
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        } else {
            alert('براوسەری تۆ پشتیوانی HLS نییە');
        }
    }
    initHLS(videoUrl, currentQuality);
    
    function hideControls() { if (!video.paused) controlsBar.style.opacity = '0'; }
    function showControls() {
        controlsBar.style.opacity = '1';
        clearTimeout(controlsTimeout);
        if (!video.paused) controlsTimeout = setTimeout(hideControls, 5000);
    }
    
    document.querySelector('.video-wrapper').addEventListener('mousemove', showControls);
    document.querySelector('.video-wrapper').addEventListener('mouseleave', () => {
        if (!video.paused) controlsBar.style.opacity = '0';
    });
    
    function togglePlay() {
        if (video.paused) {
            video.play();
            playPauseIcon.className = 'fas fa-pause';
            if (mobilePlayIcon) mobilePlayIcon.className = 'fas fa-pause';
            showControls();
        } else {
            video.pause();
            playPauseIcon.className = 'fas fa-play';
            if (mobilePlayIcon) mobilePlayIcon.className = 'fas fa-play';
            showControls();
        }
    }
    
    playPauseBtn?.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);
    if (mobilePlayPauseBtn) mobilePlayPauseBtn.addEventListener('click', togglePlay);
    
    function seekForward() { video.currentTime = Math.min(video.duration, video.currentTime + 10); showControls(); }
    function seekBackward() { video.currentTime = Math.max(0, video.currentTime - 10); showControls(); }
    
    forward10Btn?.addEventListener('click', seekForward);
    backward10Btn?.addEventListener('click', seekBackward);
    if (mobileForwardBtn) mobileForwardBtn.addEventListener('click', seekForward);
    if (mobileBackwardBtn) mobileBackwardBtn.addEventListener('click', seekBackward);
    
    video.addEventListener('timeupdate', () => {
        const percent = (video.currentTime / video.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeSpan.textContent = formatTime(video.currentTime);
    });
    video.addEventListener('loadedmetadata', () => { durationSpan.textContent = formatTime(video.duration); });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
        showControls();
    });
    
    volumeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        volumePopup.classList.toggle('show');
        setTimeout(() => volumePopup.classList.remove('show'), 5000);
    });
    volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        const icon = volumeBtn.querySelector('i');
        if (video.volume === 0) icon.className = 'fas fa-volume-mute';
        else if (video.volume < 0.5) icon.className = 'fas fa-volume-down';
        else icon.className = 'fas fa-volume-up';
    });
    
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
        } else {
            document.exitFullscreen();
            fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
        else fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
    });
    
    qualityBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        qualityMenu.classList.toggle('show');
        setTimeout(() => qualityMenu.classList.remove('show'), 5000);
    });
    document.querySelectorAll('[data-quality]').forEach(item => {
        item.addEventListener('click', (e) => {
            const quality = e.target.getAttribute('data-quality');
            currentQuality = quality;
            if (hls) {
                if (quality === 'auto') hls.currentLevel = -1;
                else {
                    const idx = hls.levels.findIndex(l => l.height === parseInt(quality));
                    if (idx !== -1) hls.currentLevel = idx;
                }
            }
            qualityMenu.classList.remove('show');
        });
    });
    
    mediaBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        mediaMenu.classList.toggle('show');
        setTimeout(() => mediaMenu.classList.remove('show'), 5000);
    });
    document.querySelectorAll('[data-sub]').forEach(item => {
        item.addEventListener('click', (e) => {
            const lang = e.target.getAttribute('data-sub');
            alert(`ژێرنووس بۆ ${lang} هەڵبژێردرا`);
            mediaMenu.classList.remove('show');
        });
    });
    document.querySelectorAll('[data-audio]').forEach(item => {
        item.addEventListener('click', (e) => {
            const audioLang = e.target.getAttribute('data-audio');
            alert(`دەنگ بۆ ${audioLang} هەڵبژێردرا`);
            mediaMenu.classList.remove('show');
        });
    });
    
    document.addEventListener('click', () => {
        qualityMenu.classList.remove('show');
        mediaMenu.classList.remove('show');
        volumePopup.classList.remove('show');
    });
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }
    
    showControls();
</script>
