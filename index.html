<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kurdflix - فیلم و درامای کوردی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هێدەر -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Kurd<span>flix</span></h1>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#" class="active">سەرەکی</a></li>
                    <li><a href="#">فیلمەکان</a></li>
                    <li><a href="#">دراماکان</a></li>
                    <li><a href="#">زنجیرەکان</a></li>
                    <li><a href="admin.html" class="admin-link">Admin</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="گەڕان بۆ فیلم یان دراما...">
                <button>🔍</button>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </header>

    <!-- سلایدەر (Hero Slider) -->
    <section class="hero-slider" id="heroSlider">
        <div class="slider-container" id="sliderContainer">
            <!-- سلایدەکان لە JS--ەوە زیاد دەکرێن -->
        </div>
        <button class="slider-btn prev" id="prevBtn">❮</button>
        <button class="slider-btn next" id="nextBtn">❯</button>
        <div class="slider-dots" id="sliderDots"></div>
    </section>

    <!-- بەشی فیلمەکان -->
    <main class="main-content">
        <div class="container">
            <div class="section-header">
                <h2>فیلمە هەرە نوێیەکان</h2>
                <a href="#" class="view-all">هەموویان ببینە →</a>
            </div>
            <div class="movies-grid" id="moviesGrid">
                <!-- کارتەکان لە JS--ەوە زیاد دەکرێن -->
            </div>
        </div>
    </main>

    <!-- فووتەر -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Kurdflix - هەموو مافەکان پارێزراون</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
