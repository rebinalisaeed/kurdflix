<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KurdFlix - دۆبلاژی کوردی</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome 6 (خۆڕایی) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body data-theme="dark">

    <!-- مینیوی سەرەوە -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            <div class="logo">
                <h1>Kurd<span>Flix</span></h1>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#" class="active">خانه</a></li>
                <li><a href="#">فیلمەکان</a></li>
                <li><a href="#">دراماکان</a></li>
                <li><a href="#">دۆبلاژەکان</a></li>
            </ul>
            <div class="theme-toggle">
                <i class="fas fa-sun" id="theme-icon"></i>
                <label class="switch">
                    <input type="checkbox" id="theme-switch">
                    <span class="slider round"></span>
                </label>
                <i class="fas fa-moon" id="theme-icon-moon"></i>
            </div>
        </div>
    </nav>

    <!-- ناوەڕۆکی سەرەکی -->
    <main class="container">
        <!-- سلاید 1: بەرهەمە نوێیەکان -->
        <section class="movie-section">
            <div class="section-header">
                <h2>🔥 بەرهەمە نوێیەکان</h2>
                <div class="slider-controls">
                    <button class="slider-btn prev-btn" data-slider="slider1"><i class="fas fa-chevron-right"></i></button>
                    <button class="slider-btn next-btn" data-slider="slider1"><i class="fas fa-chevron-left"></i></button>
                </div>
            </div>
            <div class="slider-container" id="slider1">
                <div class="movies-slider">
                    <!-- کارتەکان لێرەدا لە لایەن JavaScriptەوە دادەنرێن -->
                </div>
            </div>
        </section>

        <!-- سلاید 2: پڕبینەرترین دۆبلاژەکان -->
        <section class="movie-section">
            <div class="section-header">
                <h2>⭐ پڕبینەرترین دۆبلاژەکان</h2>
                <div class="slider-controls">
                    <button class="slider-btn prev-btn" data-slider="slider2"><i class="fas fa-chevron-right"></i></button>
                    <button class="slider-btn next-btn" data-slider="slider2"><i class="fas fa-chevron-left"></i></button>
                </div>
            </div>
            <div class="slider-container" id="slider2">
                <div class="movies-slider">
                    <!-- کارتەکان لێرەدا لە لایەن JavaScriptەوە دادەنرێن -->
                </div>
            </div>
        </section>

        <!-- سلاید 3: دراماکانی تورکی دۆبلاژکراو -->
        <section class="movie-section">
            <div class="section-header">
                <h2>🇹🇷 دراماکانی تورکی دۆبلاژکراو</h2>
                <div class="slider-controls">
                    <button class="slider-btn prev-btn" data-slider="slider3"><i class="fas fa-chevron-right"></i></button>
                    <button class="slider-btn next-btn" data-slider="slider3"><i class="fas fa-chevron-left"></i></button>
                </div>
            </div>
            <div class="slider-container" id="slider3">
                <div class="movies-slider">
                    <!-- کارتەکان لێرەدا لە لایەن JavaScriptەوە دادەنرێن -->
                </div>
            </div>
        </section>
    </main>

    <!-- فووتەر -->
    <footer>
        <p>© 2025 KurdFlix - هەموو فیلمەکان بە دۆبلاژی کوردین</p>
        <p>ڤیدیۆکان لە لایەن پلاتفۆرمی ترەوە میوانبەری دەکرێن</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
