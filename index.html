<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kurdflix - سەکۆی نوێترین فیلم و دراما</title>
    <style>
        /* ==================== فۆنتەکان ==================== */
        @font-face {
            font-family: 'NRT-Bold';
            src: url('fonts/NRT-Bd.ttf') format('truetype');
            font-weight: bold;
        }
        @font-face {
            font-family: 'NRT-Regular';
            src: url('fonts/NRT-Reg.ttf') format('truetype');
            font-weight: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'NRT-Regular', sans-serif;
            background-color: #141414;
            color: #fff;
            direction: rtl;
        }

        h1, h2, h3, .bold-text {
            font-family: 'NRT-Bold', sans-serif;
        }

        /* ==================== ناوبەری سەرەوە ==================== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background-color: transparent;
            transition: background-color 0.3s ease;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar.scrolled {
            background-color: #333333; /* پاشە ڕەنگ دوای سکرۆڵ */
        }

        .menu-icon {
            font-size: 1.8rem;
            cursor: pointer;
            order: 3; /* لای ڕاست */
        }

        .logo {
            font-family: 'NRT-Bold', sans-serif;
            font-size: 1.5rem;
            color: #e50914;
            letter-spacing: -1px;
            order: 2;
        }

        .search-icon {
            font-size: 1.5rem;
            cursor: pointer;
            order: 1;
        }

        /* مێنوی لات */
        .side-menu {
            position: fixed;
            right: -280px;
            top: 0;
            width: 260px;
            height: 100%;
            background-color: #111;
            z-index: 1100;
            transition: 0.3s;
            padding-top: 70px;
            list-style: none;
        }
        .side-menu.open {
            right: 0;
        }
        .side-menu li {
            padding: 15px 25px;
            border-bottom: 1px solid #222;
        }
        .side-menu a {
            color: #fff;
            text-decoration: none;
        }

        /* ==================== سلایدەر ==================== */
        .hero-slider {
            position: relative;
            width: 100%;
            height: 85vh; /* بەرزی 150% زیاتر لە ئاسایی */
            overflow: hidden;
            margin-top: 0;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s;
            display: flex;
            align-items: center;
            background-size: cover;
            background-position: center 20%;
        }
        .slide.active {
            opacity: 1;
            z-index: 1;
        }
        /* 6/10 ڕووبەر وێنە, 3/10 نوسین, 1/10 بەتاڵ */
        .slide-content {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 6fr 3fr 1fr;
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
        }
        .slide-text {
            grid-row: 2 / 3;
            padding: 2rem;
            max-width: 600px;
        }
        .slide-text .genre-year {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .slide-text .genre {
            background: #e50914;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .slide-text h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .slide-text p {
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'NRT-Bold', sans-serif;
        }
        .btn-play {
            background-color: white;
            color: black;
        }
        .btn-list {
            background-color: rgba(109, 109, 110, 0.7);
            color: white;
        }
        .empty-bottom {
            grid-row: 3 / 4;
        }

        /* ==================== بەشەکانی فیلمەکان ==================== */
        .section {
            margin: 40px 30px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }
        .section-header h2 {
            font-size: 1.4rem;
        }
        .view-all {
            color: #54b9d4;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .movie-row {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            scroll-behavior: smooth;
            padding-bottom: 10px;
        }
        .movie-card {
            min-width: 150px;
            width: 150px;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .movie-card img {
            width: 100%;
            border-radius: 8px;
        }
        .movie-card p {
            margin-top: 5px;
            font-size: 0.8rem;
            text-align: center;
        }
        @media (max-width: 768px) {
            .movie-card { min-width: 120px; }
            .slide-text h2 { font-size: 1.5rem; }
            .navbar { padding: 0.5rem 1rem; }
        }

        /* ==================== فووتەر ==================== */
        footer {
            background-color: #111;
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
        }
        footer .logo {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        footer p {
            color: #808080;
            font-size: 0.8rem;
        }

        /* ==================== ئەدمین پەنێل ==================== */
        .admin-panel {
            display: none;
            background: #1e1e1e;
            padding: 20px;
            margin: 20px;
            border-radius: 12px;
            z-index: 2000;
        }
        .admin-panel.show {
            display: block;
        }
        .admin-form input, .admin-form select, .admin-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            color: white;
            border: none;
        }
        .admin-form button {
            background: #e50914;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- ناوبەری سەرەوە -->
<div class="navbar" id="navbar">
    <div class="menu-icon" id="menuBtn">☰</div>
    <div class="logo">Kurdflix</div>
    <div class="search-icon" id="searchBtn">🔍</div>
</div>

<!-- مێنوی لات -->
<ul class="side-menu" id="sideMenu">
    <li><a href="#">پێشنیارەکان</a></li>
    <li><a href="#">فیلمەکان</a></li>
    <li><a href="#">زنجیرەکان</a></li>
    <li><a href="#">لیستی دڵخواز</a></li>
    <li><a href="#" id="adminLink">Admin Panel</a></li>
</ul>

<!-- سلایدەر (بدون ئایکۆنی لای ڕاست/چەپ) -->
<div class="hero-slider" id="heroSlider">
    <!-- سلایدەکان لە ڕێگەی جەی‌ئێس پڕ دەکرێنەوە -->
</div>

<!-- بەشە سەرەکییەکان -->
<main id="mainContent"></main>

<footer>
    <div class="logo">Kurdflix</div>
    <p>سەکۆیەک بۆ گەیاندنی نوێترین بەرهەمەکان</p>
    <p>© 2026 کۆپی ڕایتی کوردفلێکس</p>
</footer>

<!-- ئەدمین پەنێلی نهێنی -->
<div id="adminPanel" class="admin-panel">
    <h2>✨ ئەدمین پەنێلی کوردفلێکس</h2>
    <form id="adminForm" class="admin-form">
        <input type="text" id="title" placeholder="ناوی بەرهەم" required>
        <select id="category">
            <option>فیلم</option><option>زنجیرە</option><option>کوردی</option>
            <option>تورکی</option><option>عەرەبی</option><option>فارسی</option>
            <option>کۆری</option><option>هیندی</option><option>منداڵان</option>
        </select>
        <select id="genre">
            <option>تاوانکاری</option><option>زانستی خەیاڵی</option><option>ئاکشن</option>
            <option>کۆمیدی</option><option>دراما</option><option>ترسناک</option>
            <option>ڕۆمانسی</option><option>مێژوویی</option><option>جەنگ</option>
        </select>
        <input type="text" id="year" placeholder="ساڵی دەرچوون">
        <textarea id="desc" placeholder="کورتە"></textarea>
        <input type="text" id="poster" placeholder="لینکی وێنەی پۆستەر">
        <input type="text" id="videoLink" placeholder="لینکی ڤیدیۆ (گووگڵ درایڤ یان یوتیوب)">
        <button type="submit">🔹 زیادکردنی بەرهەم</button>
    </form>
    <div id="movieListAdmin"></div>
</div>

<script>
    // ==================== داتا دیفۆڵت (بۆ نمونە) ====================
    let movies = JSON.parse(localStorage.getItem('kurdflix_movies')) || [
        { id:1, title:"تەپەڕۆ", category:"فیلم", genre:"ئاکشن", year:"2023", desc:"فیلمێکی ئاکشنی کوردی", poster:"https://via.placeholder.com/300x450?text=Teperr%F0%9F%8E%AC", videoLink:"#", type:"movie" },
        { id:2, title:"Ertugrul", category:"تورکی", genre:"مێژوویی", year:"2014", desc:"زنجیرەی دیرلیش ئەرتۆغرول", poster:"https://via.placeholder.com/300x450?text=Ertugrul", videoLink:"#", type:"series" }
    ];

    function saveToLocal() {
        localStorage.setItem('kurdflix_movies', JSON.stringify(movies));
    }

    // ==================== پڕکردنەوەی سلایدەر ====================
    function renderSlider() {
        const sliderDiv = document.getElementById('heroSlider');
        const latestMovies = [...movies].reverse().slice(0, 5); // 5 نوێترین
        sliderDiv.innerHTML = latestMovies.map((m, idx) => `
            <div class="slide ${idx === 0 ? 'active' : ''}" style="background-image: url('${m.poster}')">
                <div class="slide-content">
                    <div class="slide-text">
                        <div class="genre-year"><span class="genre">${m.genre}</span> <span>${m.year}</span></div>
                        <h2>${m.title}</h2>
                        <p>${m.desc.substring(0, 100)}</p>
                        <div class="buttons">
                            <button class="btn btn-play" onclick="playVideo('${m.videoLink}')">🎬 سەیر کردن</button>
                            <button class="btn btn-list">➕ لیستی دڵخواز</button>
                        </div>
                    </div>
                    <div class="empty-bottom"></div>
                </div>
            </div>
        `).join('');
    }

    window.playVideo = (link) => {
        if(link && link !== '#') window.open(link, '_blank');
        else alert("لینکی ڤیدیۆ دانەنراوە");
    }

    // ==================== دروستکردنی بەشە جیاوازەکان ====================
    function renderSections() {
        const sections = [
            { name: "نوێترین بەرهەمەکان", filter: (m) => m, limit:20 },
            { name: "نوێترین فیلمەکان", filter: (m) => m.category === "فیلم", limit:20 },
            { name: "نوێترین زنجیرەکان", filter: (m) => m.category === "زنجیرە", limit:20 },
            { name: "نوێترین بەرهەمی کوردی", filter: (m) => m.category === "کوردی", limit:20 },
            { name: "نوێترین بەرهەمی تورکی", filter: (m) => m.category === "تورکی", limit:20 },
            { name: "نوێترین بەرهەمی عەرەبی", filter: (m) => m.category === "عەرەبی", limit:20 },
            { name: "نوێترین بەرهەمی فارسی", filter: (m) => m.category === "فارسی", limit:20 },
            { name: "نوێترین بەرهەمی کۆری", filter: (m) => m.category === "کۆری", limit:20 },
            { name: "نوێترین بەرهەمی هیندی", filter: (m) => m.category === "هیندی", limit:20 },
            { name: "نوێترین بەرهەمی منداڵان", filter: (m) => m.category === "منداڵان", limit:20 }
        ];

        const main = document.getElementById('mainContent');
        main.innerHTML = sections.map(section => {
            const filtered = movies.filter(section.filter).reverse().slice(0, section.limit);
            if(filtered.length === 0) return '';
            return `
                <div class="section">
                    <div class="section-header">
                        <h2>${section.name}</h2>
                        <div class="view-all" onclick="alert('پەڕەی تەواوی ${section.name} لە وەشانی داھاتوودا')">بینینی هەموو ›</div>
                    </div>
                    <div class="movie-row">
                        ${filtered.map(m => `
                            <div class="movie-card" onclick="playVideo('${m.videoLink}')">
                                <img src="${m.poster}" alt="${m.title}">
                                <p>${m.title} (${m.year})</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    // ==================== ئەدمین پەنێل ====================
    function showAdminPanel(show) {
        const panel = document.getElementById('adminPanel');
        if(show) panel.classList.add('show');
        else panel.classList.remove('show');
    }

    document.getElementById('adminForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newMovie = {
            id: Date.now(),
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            genre: document.getElementById('genre').value,
            year: document.getElementById('year').value,
            desc: document.getElementById('desc').value,
            poster: document.getElementById('poster').value,
            videoLink: document.getElementById('videoLink').value,
            type: 'movie'
        };
        movies.unshift(newMovie);
        saveToLocal();
        renderSlider();
        renderSections();
        alert('بەرهەمەکە زیاد کرا!');
        e.target.reset();
    });

    // ==================== ڕووداوەکانی UI ====================
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if(window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });

    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sideMenu').classList.toggle('open');
    };
    document.getElementById('searchBtn').onclick = () => alert('گەڕان: لە وەشانی داھاتوودا زیاد دەکرێت');
    document.getElementById('adminLink').onclick = (e) => {
        e.preventDefault();
        showAdminPanel(true);
        document.getElementById('sideMenu').classList.remove('open');
    };

    // بەدەست کردنەوەی ئەدمین لە ڕێگەی URL
    if(window.location.search.includes('admin=true')) showAdminPanel(true);

    // Initial Render
    renderSlider();
    renderSections();
</script>
</body>
</html>
